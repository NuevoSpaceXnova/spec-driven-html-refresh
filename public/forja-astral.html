/* ============ ACTUALIZACIÓN DE VALORES ============ */
function valueOf(key){
  const [k, a, b] = key.split(':');
  const L = state.lvl;
  const e = energy();
  const P = activePlanet();
  switch(k){
    case 'res':     return fmt(state.res[a]);
    case 'energy':  return `${fmt(e.prod)} / ${fmt(e.cons)}`;
    case 'eff':     return (e.eff * 100).toLocaleString('es-ES',{minimumFractionDigits:1, maximumFractionDigits:1}) + ' %';
    case 'eProd':   return fmt(e.prod);
    case 'eCons':   return fmt(e.cons);
    case 'fields':  return fmt(usedFields(P)) + ' / ' + fmt(maxFields(P));
    case 'lvl':     return 'Nivel ' + (L[a] || 0);
    case 'cost':    return fmt(costOf(a, (L[a] || 0) + 1)[b]);
    case 'hourly': {
      const r = rates();
      let v = r[a];
      if (a === 'deut') v -= r.fusCons;
      return fmt(v * state.speed);
    }
    case 'perSec': {
      const r = rates();
      let v = r[a];
      if (a === 'deut') v -= r.fusCons;
      return fmt2(v * state.speed / 3600);
    }
    case 'consE':   return fmt(F[CONS_KEY[a]](L[a] || 0));
    case 'solarE':  return fmt(F.solar(L.sol || 0));
    case 'rate': { const r = rates(); let v = r[a]; if (a === 'deut') v -= r.fusCons; return '+' + fmt(v * state.speed) + '/h'; }
    case 'queueTxt': { const q = P.queue; return q ? ('Construyendo ' + ITEMS[q.id].name + ' nivel ' + ((P.lvl[q.id] || 0) + 1) + ' · ' + mmss(Math.max(0, Math.ceil((q.end - state.simSec) / state.speed)))) : 'Sin construcciones en cola.'; }
    case 'pe': return fmt(prodRow(a).e);
    case 'ph': return fmt(prodRow(a).h);
    case 'pd': return fmt(prodRow(a).h * 24);
    case 'pw': return fmt(prodRow(a).h * 168);
    case 'eDef': return fmt(e.prod - e.cons);
    case 'fusE':    return fmt(F.fusE(L.fus || 0));
    case 'fusD':    return fmt(F.fusD(L.fus || 0));
    case 'missCap': return fmt(10 * (L.silo || 0));
    case 'missCount': return fmt(state.fleet.mi || 0);
    case 'cap':     return fmt(capOf(L[CAP_KEY[a]] || 0));
    case 'stored':  return fmt(state.res[a]);
    case 'planet':  return P ? P.name : 'Ceres Prima';
    case 'unread':  return unreadCount() ? String(unreadCount()) : '';
    case 'usdt':    return (state.res.token / 100).toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' USDT';
    case 'hangar':  return fmt(state.fleet[a] || 0);
    case 'rank':    return rankText(a);
    case 'power':   return fmt(Math.floor(state.spent / 1000));
    case 'fortress': return fortressText();
  }
  return '';
}

// Estado de los botones de construcción y de las barras de cola y almacén
function refreshBuildButtons(){
  const P = activePlanet();
  const q = P.queue;
  document.querySelectorAll('[data-btn]').forEach(btn => {
    const id = btn.dataset.btn, it = ITEMS[id];
    if (!it) return;
    if (it.view !== 'research' && q && q.id === id){
      btn.disabled = true;
      btn.textContent = 'En construcción · ' + mmss(Math.max(0, Math.ceil((q.end - state.simSec) / state.speed)));
    } else if (it.view !== 'research' && q){
      btn.disabled = true;
      btn.textContent = 'Cola ocupada';
    } else {
      btn.disabled = !canAfford(id);
      btn.textContent = 'Subir a nivel ' + ((state.lvl[id] || 0) + 1);
    }
  });
  document.querySelectorAll('[data-qwrap]').forEach(w => {
    const id = w.dataset.qwrap;
    w.hidden = !(q && q.id === id);
  });
  if (q){
    const pct = Math.min(100, Math.max(0, (1 - (q.end - state.simSec) / q.total) * 100));
    document.querySelectorAll('[data-qbar]').forEach(el => { if (el.dataset.qbar === q.id) el.style.width = pct.toFixed(1) + '%'; });
  }
}

function refresh(){
  refreshExtra();
  const e = energy();
  document.querySelectorAll('[data-bind]').forEach(el => { el.textContent = valueOf(el.dataset.bind); });
  document.querySelectorAll('[data-pct]').forEach(el => {
    const r = el.dataset.pct;
    const cap = capOf(state.lvl[CAP_KEY[r]] || 0);
    el.style.width = Math.min(100, state.res[r] / cap * 100).toFixed(1) + '%';
  });
  document.querySelectorAll('[data-danger]').forEach(el => el.classList.toggle('danger', e.deficit));
  document.querySelectorAll('[data-fieldbar]').forEach(el => { el.style.width = Math.min(100, usedFields(activePlanet()) / maxFields(activePlanet()) * 100).toFixed(1) + '%'; });
  document.querySelectorAll('[data-costrow]').forEach(row => {
    const [id, r] = row.dataset.costrow.split('|');
    const c = costOf(id, (state.lvl[id] || 0) + 1);
    row.classList.toggle('lack', state.res[r] < c[r]);
  });
  refreshBuildButtons();
}

// Estados dependientes de cantidades e input del astillero y de la pestaña Flota
function refreshExtra(){
  refreshAlert();
  refreshFase5();
  refreshMissions();
  const launch = document.querySelector('[data-action="launch-exp"]');
  if (launch) launch.disabled = state.lvl.ap < 1 || (state.fleet.nc || 0) + (state.fleet.cz || 0) + (state.fleet.cr || 0) + (state.fleet.sp || 0) < 1;
  document.querySelectorAll('[data-qty]').forEach(inp => {
    const id = inp.dataset.qty, s = SHIPS[id];
    const q = Math.max(1, Math.floor(Number(inp.value) || 1));
    document.querySelectorAll('[data-shiprow^="' + id + '|"]').forEach(row => {
      const r = row.dataset.shiprow.split('|')[1];
      row.classList.toggle('lack', state.res[r] < (s.cost[r] || 0) * q);
    });
    const btn = document.querySelector('[data-ship="' + id + '"]');
    if (btn) btn.disabled = !unitOk(id) || !RES.every(r => state.res[r] >= (s.cost[r] || 0) * q);
  });
}

function afterRender(){
  if (state.tab === 'market') renderBook();
  if (state.tab === 'expeditions') renderLog();
  if (state.tab === 'alliances') { renderWall(); }
  if (state.tab === 'overview'){ renderMoves(); renderCC(); }
  if (state.tab === 'fleet') renderMoves();
  if (state.tab === 'fleet') updateFleetCalc();
  if (state.tab === 'ranking') renderRanking();
}

/* ---------- Menú de perfil ---------- */
let menuOpen = false;
function renderUserMenu(){
  const el = document.getElementById('user-menu');
  if (!el) return;
  const items = TABS.filter(t => t.menu).map(t => `
    <button class="user-item${state.tab === t.id ? ' active' : ''}" data-menu-tab="${t.id}">
      ${icon(t.icon)}<span>${t.label}</span>${t.id === 'inbox' ? '<span class="unread-badge" data-bind="unread"></span>' : ''}
    </button>`).join('');
  el.innerHTML = `
    <button class="user-btn" data-menu-toggle aria-haspopup="true" aria-expanded="${menuOpen}">
      ${icon('user')}<span class="user-name">Perfil</span><span aria-hidden="true">&#9662;</span>
    </button>
    <div class="user-drop" ${menuOpen ? '' : 'hidden'}>${items}<button class="user-item" data-menu-logout>Cerrar sesión</button></div>`;
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-menu-logout]')){ logout(); return; }
  const tog = e.target.closest('[data-menu-toggle]');
  if (tog){ menuOpen = !menuOpen; renderUserMenu(); return; }
  const item = e.target.closest('[data-menu-tab]');
  if (item){ state.tab = item.dataset.menuTab; menuOpen = false; render(); return; }
  if (menuOpen && !e.target.closest('#user-menu')){ menuOpen = false; renderUserMenu(); }
});

/* ---------- Sesión y cuentas (locales en este navegador) ---------- */
function currentUser(){
  try { return localStorage.getItem('forja-astral-session') || ''; } catch (e) { return ''; }
}
function saveKeyFor(u){ return u ? 'forja-astral-save-v2:' + u : 'forja-astral-save-v2'; }
function loadAccounts(){
  try { return JSON.parse(localStorage.getItem('forja-astral-accounts') || '{}'); } catch (e) { return {}; }
}
function saveAccounts(a){ localStorage.setItem('forja-astral-accounts', JSON.stringify(a)); }
function newSalt(){
  return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function hashPass(salt, pass){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pass));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function logout(){
  saveGame();
  localStorage.removeItem('forja-astral-session');
  location.reload();
}

/* ---------- Pantalla de inicio ---------- */
let authMode = 'login';
function hideStart(){ document.getElementById('start').hidden = true; }
function setAuthMode(m){
  authMode = m;
  document.getElementById('tab-login').className = 'btn inline' + (m === 'login' ? '' : ' secondary');
  document.getElementById('tab-reg').className = 'btn inline' + (m === 'register' ? '' : ' secondary');
  document.getElementById('auth-pass2-wrap').hidden = m !== 'register';
  document.getElementById('auth-submit').textContent = m === 'register' ? 'Crear cuenta' : 'Entrar';
  document.getElementById('auth-pass').autocomplete = m === 'register' ? 'new-password' : 'current-password';
  document.getElementById('auth-err').textContent = '';
}
async function submitAuth(){
  const err = document.getElementById('auth-err');
  const user = (document.getElementById('auth-user').value || '').trim();
  const pass = document.getElementById('auth-pass').value || '';
  const pass2 = document.getElementById('auth-pass2').value || '';
  if (!/^[A-Za-z0-9_]{3,20}$/.test(user)){ err.textContent = 'Usuario: de 3 a 20 letras, números o guion bajo.'; return; }
  if (pass.length < 6){ err.textContent = 'La contraseña necesita al menos 6 caracteres.'; return; }
  const accounts = loadAccounts();
  const key = user.toLowerCase();
  if (authMode === 'register'){
    if (pass !== pass2){ err.textContent = 'Las contraseñas no coinciden.'; return; }
    if (accounts[key]){ err.textContent = 'Ese usuario ya existe. Inicia sesión.'; return; }
    const salt = newSalt();
    accounts[key] = {name:user, salt, hash:await hashPass(salt, pass), created:Date.now()};
    saveAccounts(accounts);
  } else {
    const acc = accounts[key];
    if (!acc || (await hashPass(acc.salt, pass)) !== acc.hash){ err.textContent = 'Usuario o contraseña incorrectos.'; return; }
  }
  localStorage.setItem('forja-astral-session', key);
  location.reload();
}
/* Acceso rápido: cuenta local de prueba "Piloto_Prueba" (contraseña: prueba123) */
async function quickAccess(){
  const key = 'piloto_prueba';
  const accounts = loadAccounts();
  if (!accounts[key]){
    const salt = newSalt();
    accounts[key] = {name:'Piloto_Prueba', salt, hash:await hashPass(salt, 'prueba123'), created:Date.now(), test:true};
    saveAccounts(accounts);
  }
  localStorage.setItem('forja-astral-session', key);
  location.reload();
}
function initStart(){
  const scr = document.getElementById('start');
  document.getElementById('tab-login').addEventListener('click', () => setAuthMode('login'));
  document.getElementById('tab-reg').addEventListener('click', () => setAuthMode('register'));
  document.getElementById('auth-form').addEventListener('submit', e => { e.preventDefault(); submitAuth(); });
  document.getElementById('auth-quick').addEventListener('click', quickAccess);
  const key = currentUser();
  const acc = key ? loadAccounts()[key] : null;
  if (acc){
    hideStart();
    if (state.profile) state.profile.name = acc.name;
    saveGame();
    render();
    return;
  }
  if (key) localStorage.removeItem('forja-astral-session');
  setAuthMode('login');
  scr.hidden = false;
}

/* ---------- Centro de mando: partes que cambian en tiempo real ---------- */
function renderCC(){
  const P = activePlanet();
  const al = document.getElementById('cc-alerts');
  if (al){
    const enemy = state.moves.filter(m => m.owner === 'enemy').sort((a, b) => a.endAt - b.endAt);
    al.innerHTML = enemy.length ? enemy.map(m => {
      const now = Date.now();
      const rem = Math.max(0, Math.ceil((m.endAt - now) / 1000));
      const pct = Math.min(100, Math.max(0, (now - m.startAt) / (m.endAt - m.startAt) * 100));
      return `<div class="cc-alert">
        <div class="cc-alert-head"><span class="tag-bad">Flota hostil · Atacar</span><span class="mono">${mmss(rem)}</span></div>
        <div class="bar"><span style="width:${pct.toFixed(1)}%;background:var(--status-danger)"></span></div>
        <div class="muted" style="font-size:12px">${esc(m.label)} · ${esc(fleetSummary(m.fleet))}</div>
      </div>`;
    }).join('') : '<div class="empty">Sin ataques entrantes. Tu imperio está en calma.</div>';
  }
  const fl = document.getElementById('cc-fleets');
  if (fl){
    const own = state.moves.filter(m => m.owner === 'own');
    fl.innerHTML = own.length
      ? own.map(m => `<div class="cc-row" style="margin-bottom:8px"><span>${esc(m.label)}</span><span class="mono">${mmss(Math.max(0, Math.ceil((m.endAt - Date.now()) / 1000)))}</span></div>`).join('')
        + '<button class="btn" data-action="go-tab" data-tab="fleet" style="margin-top:4px">Ir a la pestaña Flota</button>'
      : '<div class="cc-row"><span class="muted">Sin flotas en vuelo.</span></div><button class="btn" data-action="go-tab" data-tab="fleet" style="margin-top:8px">Enviar flota</button>';
  }
  const nx = document.getElementById('cc-next');
  if (nx){
    const cards = [];
    const enemy = state.moves.filter(m => m.owner === 'enemy').sort((a, b) => a.endAt - b.endAt);
    if (enemy.length){
      const rem = Math.max(0, Math.ceil((enemy[0].endAt - Date.now()) / 1000));
      cards.push({tone:'danger', title:'Protege tu planeta', text:enemy.length + ' flota(s) hostil(es) llegan en ' + mmss(rem) + '. Revisa tu defensa.', btn:'Ver flotas', tab:'fleet'});
    }
    if (energy().deficit){
      cards.push({tone:'warn', title:'Corrige el déficit de energía', text:'Tus minas producen solo el ' + (energy().eff * 100).toFixed(0) + ' % de su potencial. Sube la planta solar o construye un reactor de fusión.', btn:'Ver instalaciones', tab:'facilities'});
    }
    if (!state.lvl.lab){
      cards.push({tone:'info', title:'Construye un laboratorio', text:'Sin laboratorio no puedes investigar tecnologías.', btn:'Ver instalaciones', tab:'facilities'});
    } else if (!state.lvl.sy){
      cards.push({tone:'info', title:'Construye un astillero', text:'Sin astillero no puedes fabricar naves ni defensas.', btn:'Ver instalaciones', tab:'facilities'});
    }
    if (cards.length < 3) cards.push({tone:'info', title:'Sigue creciendo', text:'Mejora tus minas para aumentar la producción de tu imperio.', btn:'Ver recursos', tab:'resources'});
    nx.innerHTML = cards.slice(0, 3).map(c => `<article class="cc-next ${c.tone}">
      <h3>${c.title}</h3><p class="desc">${c.text}</p>
      <button class="btn" data-action="go-tab" data-tab="${c.tab}">${c.btn}</button></article>`).join('');
  }
}

/* ============ RENDER Y EVENTOS ============ */
TABS.forEach(t => { if (['inbox','wallet','profile','settings'].includes(t.id)) t.menu = true; });
const NAV_GROUPS = {
  planet:   {label:'Mi planeta', icon:'globe', children:[['resources','Edificios'],['production','Producción y almacenes']], extra:['storage','facilities']},
  tech:     {label:'Tecnología', icon:'atom', children:[['research','Investigación'],['tree','Árbol Tecnológico']], extra:[]},
  fleetdef: {label:'Flota y defensa', icon:'rocket', children:[['shipyard','Astillero'],['fleet','Flota']], extra:[]}
};
const NAV_ORDER = ['overview','planet','tech','fleetdef','galaxy','alliances','market','expeditions','ranking','simulator','empire'];
function navItemHTML(t){
  return `<button class="nav-item${state.tab === t.id ? ' active' : ''}" data-tab="${t.id}"${state.tab === t.id ? ' aria-current="page"' : ''}>${icon(t.icon)}<span class="label">${t.label}</span></button>`;
}
function renderNav(){
  if (!state.navOpen) state.navOpen = {};
  document.getElementById('nav').innerHTML = NAV_ORDER.map(key => {
    if (!NAV_GROUPS[key]) return navItemHTML(TABS.find(t => t.id === key));
    const g = NAV_GROUPS[key];
    const open = state.navOpen[key] !== false;
    const act = g.children.map(c => c[0]).concat(g.extra).includes(state.tab);
    const subs = g.children.map(([id, l]) => `<button class="nav-item sub${state.tab === id ? ' active' : ''}" data-tab="${id}"${state.tab === id ? ' aria-current="page"' : ''}><span class="label">${l}</span></button>`).join('');
    return `<button class="nav-group-head${act ? ' active' : ''}" data-nav-toggle="${key}" aria-expanded="${open}">${icon(g.icon)}<span class="label">${g.label}</span><span class="chev">${icon('chevron')}</span></button>
      <div class="nav-sub${open ? '' : ' closed'}">${subs}</div>`;
  }).join('');
}

function render(){
  renderNav();
  renderUserMenu();
  document.getElementById('view').innerHTML = VIEWS[state.tab]();
  afterRender();
  refresh();
}

document.getElementById('nav').addEventListener('click', e => {
  const g = e.target.closest('[data-nav-toggle]');
  if (g){
    const k = g.dataset.navToggle;
    state.navOpen = state.navOpen || {};
    state.navOpen[k] = state.navOpen[k] === false;
    renderNav();
    return;
  }
  const b = e.target.closest('[data-tab]');
  if (!b) return;
  state.tab = b.dataset.tab;
  render();
});

const viewEl = document.getElementById('view');
viewEl.addEventListener('click', e => {

});

setInterval(saveGame, 30000);
