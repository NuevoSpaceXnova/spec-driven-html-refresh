 <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forja Astral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ======================================================================
   FORJA ASTRAL · Consola táctica (hard sci-fi)
   Paleta estricta: sin morado, cian ni azules brillantes.
   ====================================================================== */
:root{
  /* Fondos */
  --bg-app:#0B0D10;        /* espacio profundo */
  --bg-panel:#13171D;      /* paneles, tarjetas, sidebar */
  --bg-surface:#1C222B;    /* inputs, sub-paneles, hover */
  /* Bordes */
  --border-subtle:#2A323D;
  --border-active:#2EA043;
  /* Texto */
  --text-primary:#E6E8EB;
  --text-secondary:#8B949E;
  --text-muted:#8B949E;
  /* Acentos */
  --accent-primary:#2EA043; --accent-hover:#238636;
  --bar-fill:#2EA043; --bar-track:#1C222B;  /* barras de progreso */
  /* Estados */
  --status-success:#2E7D5B; --status-danger:#B83A3A; --status-warn:#2EA043;
  /* Recursos: iconos monocromáticos */
  --res-metal:#8B949E; --res-crystal:#8B949E; --res-deuterium:#2E7D5B;
  --res-energy:#2EA043; --res-token:#2EA043;
  /* Tipografía */
  --font-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:4px; --r-lg:6px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input{font-family:inherit}
::selection{background:var(--accent-primary);color:var(--bg-app)}
.mono{font-family:var(--font-mono)}
.danger{color:var(--status-danger)!important}
*{scrollbar-width:thin;scrollbar-color:var(--border-subtle) transparent}

/* ---------- ESTRUCTURA: pantalla completa, 3 zonas fijas ---------- */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ---------- HEADER (64px) ---------- */
.topbar{position:relative;z-index:20;height:64px;flex:none;padding:0 20px;background:var(--bg-panel);border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:12px;flex:none;min-width:0}
.logo{width:30px;height:30px;border-radius:var(--r);background:var(--accent-primary);color:var(--bg-app);display:grid;place-items:center;flex:none}
.brand-name{font-weight:700;font-size:14px;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
.select{height:34px;background:var(--bg-surface);color:var(--text-primary);border:1px solid var(--border-subtle);border-radius:var(--r);padding:0 10px;font:500 13px var(--font-mono);cursor:pointer}
.select:hover{border-color:var(--text-secondary)}
.select:focus-visible{outline:1px solid var(--accent-primary);outline-offset:1px}
.planet{max-width:210px}
.resources{flex:1;display:flex;justify-content:center;gap:0;min-width:0;overflow-x:auto;scrollbar-width:none}
.resources::-webkit-scrollbar{display:none}
.res-box{min-width:118px;height:40px;border:0;border-left:1px solid var(--border-subtle);border-radius:0;background:transparent;display:flex;align-items:center;gap:10px;padding:0 14px;flex:none}
.res-box:last-child{border-right:1px solid var(--border-subtle)}
.res-box svg{flex:none;width:16px;height:16px}
.res-label{font-size:11px;color:var(--text-secondary);line-height:1.1;white-space:nowrap}
.res-val{font:500 14px var(--font-mono);line-height:1.3;white-space:nowrap;color:var(--text-primary)}
.res-box[title="Token"] .res-val{color:var(--accent-primary)!important}

/* ---------- LAYOUT ---------- */
.layout{display:flex;flex:1;min-height:0}
.sidebar{width:220px;flex:none;background:var(--bg-panel);border-right:1px solid var(--border-subtle);padding:12px 0;overflow-y:auto}
.sidebar nav{display:flex;flex-direction:column;gap:0}
.nav-item{width:100%;display:flex;align-items:center;gap:12px;height:40px;padding:0 16px 0 13px;border-radius:0;background:transparent;border:0;border-left:3px solid transparent;color:var(--text-secondary);font:500 14px var(--font-sans);cursor:pointer;text-align:left}
.nav-item:hover{background:var(--bg-surface);color:var(--text-primary)}
.nav-item.active{background:var(--bg-surface);color:var(--text-primary);border-left-color:var(--accent-primary)}
.nav-item.active svg{color:var(--accent-primary)}
.nav-item.soon{color:var(--text-muted);opacity:.7}
.nav-item:focus-visible{outline:1px solid var(--accent-primary);outline-offset:-1px}
.nav-item .label{flex:1;min-width:0}
.soon-tag{font:500 10px var(--font-mono);color:var(--text-muted);border:1px solid var(--border-subtle);border-radius:2px;padding:1px 5px;text-transform:uppercase}

.main{flex:1;min-width:0;padding:24px;background:var(--bg-app);overflow-y:auto}
.main-inner{max-width:1280px;margin:0 auto}
.page-title{font-size:18px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px}
.page-sub{color:var(--text-secondary);font-size:13px;margin:0 0 24px}
.section-title{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.12em;margin:24px 0 12px;display:flex;align-items:center;gap:10px}
.section-title::after{content:"";flex:1;height:1px;background:var(--border-subtle)}

/* ---------- CARDS ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card:hover{border-color:#3A4452}
.card-head{display:flex;align-items:center;gap:12px}
.icon-box{width:38px;height:38px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--r);display:grid;place-items:center;flex:none;color:var(--text-secondary)}
.card-title{font-size:15px;font-weight:600;flex:1;min-width:0}
.badge{font:500 11px var(--font-mono);color:var(--text-primary);background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:2px;padding:2px 6px;white-space:nowrap}
.desc{font-size:12px;color:var(--text-secondary);margin:0;line-height:1.55}
.stat-line{font-size:12px;color:var(--text-secondary)}
.stat-line b{font:500 12px var(--font-mono);color:var(--text-primary)}
.cost{background:var(--bg-app);border:1px solid var(--border-subtle);border-radius:var(--r);padding:10px 12px;font:500 12px var(--font-mono);display:flex;flex-direction:column;gap:4px}
.cost-row{display:flex;justify-content:space-between;gap:8px}
.cost-row.lack{color:var(--status-danger)}
.btn{height:36px;width:100%;border-radius:var(--r);border:0;font:700 13px var(--font-sans);letter-spacing:.02em;background:var(--accent-primary);color:var(--bg-app);cursor:pointer;transition:background .12s}
.btn:hover:not(:disabled){background:var(--accent-hover)}
.btn:disabled{background:var(--bg-surface);color:var(--text-muted);border:1px solid var(--border-subtle);cursor:not-allowed;font-weight:500}
.btn:focus-visible{outline:1px solid var(--text-primary);outline-offset:2px}
.btn[style*="status-danger"]{color:var(--text-primary)}
.btn[style*="status-danger"]:hover:not(:disabled){filter:brightness(.88)}

/* ---------- OVERVIEW ---------- */
.panel{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--r);overflow:hidden}
.table{width:100%;border-collapse:collapse}
.table th{font:600 11px var(--font-sans);text-transform:uppercase;letter-spacing:.1em;color:var(--text-secondary);text-align:left;padding:10px 16px;border-bottom:1px solid var(--border-subtle);background:var(--bg-surface)}
.table td{padding:11px 16px;border-bottom:1px solid var(--border-subtle);font-size:13px}
.table tbody tr:hover td{background:rgba(28,34,43,.6)}
.table tr:last-child td{border-bottom:0}
.table .r{text-align:right}
.table td.mono{font:500 13px var(--font-mono)}
.td-res{display:inline-flex;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin:16px 0}
.kpi{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.kpi-label{font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.08em}
.kpi-val{font:600 22px var(--font-mono)}
.setting{display:flex;flex-direction:column;gap:8px;padding:16px;background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--r)}
.setting label{font-weight:600;font-size:14px}
.setting p{margin:0;font-size:12px;color:var(--text-secondary)}
.empty{padding:24px;color:var(--text-muted);font-size:13px}

/* ---------- FORMULARIOS ---------- */
.pad{padding:16px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-secondary)}
.input,.qty{height:38px;width:100%;background:var(--bg-surface);color:var(--text-primary);border:1px solid var(--border-subtle);border-radius:var(--r);padding:0 10px;font:500 13px var(--font-mono)}
.input:hover,.qty:hover{border-color:#3A4452}
.input:focus-visible,.qty:focus-visible{outline:none;border-color:var(--accent-primary)}
.inline-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline-form .qty{width:96px;flex:none}
.inline-form .btn{flex:1;width:auto}
.btn.inline{width:auto;height:30px;padding:0 12px;font-size:12px}
.toolbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--r);padding:16px;margin-bottom:16px}
.toolbar .page-sub{margin:0 0 0 auto}
.select.full{width:100%}
.market-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--text-muted)}
.row-own td{background:var(--bg-surface)}
.row-own td:first-child{box-shadow:inset 3px 0 0 var(--accent-primary)}
.mono-cell{font:500 13px var(--font-mono)}
.modal-back{position:fixed;inset:0;background:rgba(11,13,16,.8);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--bg-panel);border:1px solid var(--border-subtle);border-top:2px solid var(--accent-primary);border-radius:var(--r);padding:20px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.modal h2{margin:0;font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.rows{display:flex;flex-direction:column;gap:6px;font:500 12px var(--font-mono);background:var(--bg-app);border:1px solid var(--border-subtle);border-radius:var(--r);padding:12px}
.rows>div{display:flex;justify-content:space-between;gap:12px}
.tag-ok{color:var(--status-success)}
.tag-bad{color:var(--status-danger)}
@media (max-width:767px){ .market-grid{grid-template-columns:1fr} }

/* ---------- MISIONES / BARRAS ---------- */
.mission{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--border-subtle)}
.mission:last-child{border-bottom:0}
.mission-head{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.bar{height:4px;background:var(--bar-track);border-radius:1px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--bar-fill);transition:width .3s}
.mission-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}
.msg{background:var(--bg-app);border:1px solid var(--border-subtle);border-radius:var(--r);padding:10px 12px;font-size:13px}

/* ---------- ALERTAS ---------- */
[hidden]{display:none!important}
.alert{flex:none;z-index:19;background:var(--status-danger);color:var(--text-primary);font:600 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;padding:9px 24px;text-align:center;animation:alertPulse 1.4s ease-in-out infinite}
@keyframes alertPulse{0%,100%{opacity:1}50%{opacity:.7}}
.unread-badge{font:600 10px var(--font-mono);color:var(--text-primary);background:var(--status-danger);border-radius:2px;padding:1px 6px;min-width:18px;text-align:center}
.unread-badge:empty{display:none}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:767px){ .grid3{grid-template-columns:1fr} }

/* ---------- MENÚ DE PERFIL ---------- */
.user-menu{position:relative;flex:none}
.user-btn{height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--border-subtle);border-radius:var(--r);background:var(--bg-surface);color:var(--text-primary);font:500 13px var(--font-sans);cursor:pointer}
.user-btn:hover{border-color:var(--text-secondary)}
.user-btn:focus-visible{outline:1px solid var(--accent-primary);outline-offset:2px}
.user-drop{position:absolute;top:calc(100% + 8px);right:0;min-width:220px;background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--r);padding:4px 0;display:flex;flex-direction:column;gap:0;box-shadow:0 12px 32px rgba(0,0,0,.5);z-index:30}
.user-item{height:38px;display:flex;align-items:center;gap:12px;padding:0 14px 0 11px;border-radius:0;border:0;border-left:3px solid transparent;background:transparent;color:var(--text-secondary);font:500 13px var(--font-sans);cursor:pointer;text-align:left}
.user-item:hover{background:var(--bg-surface);color:var(--text-primary)}
.user-item.active{background:var(--bg-surface);color:var(--text-primary);border-left-color:var(--accent-primary)}
.user-item .unread-badge{margin-left:auto}
@media (max-width:767px){ .user-name{display:none} .user-drop{position:fixed;left:12px;right:12px;top:72px;min-width:0} }

/* ---------- ACCESO / REGISTRO ---------- */
.start{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;overflow-y:auto;
  background-color:var(--bg-app);
  background-image:
    linear-gradient(rgba(42,50,61,.22) 1px, transparent 1px),
    linear-gradient(90deg, rgba(42,50,61,.22) 1px, transparent 1px),
    linear-gradient(rgba(42,50,61,.10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(42,50,61,.10) 1px, transparent 1px);
  background-size:96px 96px,96px 96px,24px 24px,24px 24px;
  background-position:center center}
.start-card{width:100%;max-width:448px;background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--r);padding:32px;display:flex;flex-direction:column;gap:16px;text-align:left;position:relative}
.start-card::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:2px;background:var(--accent-primary)}
.start-logo{width:40px;height:40px;margin:0;border-radius:var(--r);background:var(--accent-primary);color:var(--bg-app);display:grid;place-items:center}
.start-logo svg{width:22px;height:22px}
.start-title{font-size:28px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin:0;line-height:1.1;color:var(--text-primary)}
.start-tag{font-size:14px;color:var(--text-secondary);margin:-8px 0 4px}
.start-card .field{text-align:left}
.auth-tabs{display:flex;border-bottom:1px solid var(--border-subtle)}
.auth-tabs .btn,.auth-tabs .btn.secondary{flex:1;width:auto;height:40px;background:transparent;border:0;border-bottom:2px solid var(--accent-primary);margin-bottom:-1px;border-radius:0;color:var(--text-primary);font:600 13px var(--font-sans);letter-spacing:.04em}
.auth-tabs .btn.secondary{border-bottom-color:transparent;color:var(--text-secondary);font-weight:500}
.auth-tabs .btn:hover:not(:disabled){background:transparent;color:var(--text-primary)}
#auth-submit{height:40px;font-size:14px}
.btn-quick{height:34px;width:100%;background:transparent;border:1px dashed var(--border-subtle);border-radius:var(--r);color:var(--text-secondary);font:500 12px var(--font-sans);letter-spacing:.04em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-quick:hover{border-color:var(--accent-primary);color:var(--accent-primary)}
.btn-quick:focus-visible{outline:1px solid var(--accent-primary);outline-offset:2px}
.start-foot{font-size:12px!important;color:var(--text-secondary);margin:0;padding-top:14px;border-top:1px solid var(--border-subtle)}
.btn.secondary{background:var(--bg-surface);color:var(--text-primary);border:1px solid var(--border-subtle);font-weight:500}
.btn.secondary:hover:not(:disabled){background:var(--bg-panel);border-color:var(--text-secondary)}

/* ---------- MENÚ AGRUPADO ---------- */
.nav-group-head{width:100%;display:flex;align-items:center;gap:12px;height:36px;padding:0 16px;margin-top:6px;border-radius:0;background:transparent;border:0;color:var(--text-secondary);font:600 11px var(--font-sans);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;text-align:left}
.nav-group-head:hover{color:var(--text-primary)}
.nav-group-head.active{color:var(--text-primary)}
.nav-group-head svg{width:14px;height:14px}
.nav-group-head .label{flex:1;min-width:0}
.nav-group-head .chev{display:flex;transition:transform .15s}
.nav-group-head[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.nav-sub{display:flex;flex-direction:column;gap:0;margin:0 0 4px}
.nav-sub.closed{display:none}
.nav-item.sub{padding-left:29px;height:36px;font-size:13px}

/* ---------- CENTRO DE MANDO ---------- */
.res-rate{font:500 10px var(--font-mono);color:var(--text-muted);white-space:nowrap}
.cc-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
.cc-side{display:flex;flex-direction:column;gap:16px}
.cc-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.cc-planet{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
/* Vista previa sobria del planeta: esfera gris/ocre con terminador */
.cc-planet-img{width:72px;height:72px;border-radius:50%;flex:none;position:relative;
  background:
    radial-gradient(circle at 34% 30%, rgba(230,232,235,.22), transparent 42%),
    repeating-linear-gradient(-18deg, rgba(0,0,0,0) 0 7px, rgba(11,13,16,.18) 7px 9px),
    radial-gradient(circle at 40% 38%, #7E8C82 0%, #4F5E54 45%, #2E3531 75%, #1C1F23 100%);
  box-shadow:inset -14px -10px 22px rgba(11,13,16,.85), 0 0 0 1px var(--border-subtle)}
.cc-planet-img::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px dashed rgba(139,148,158,.35)}
.cc-planet-img svg{display:none}
.cc-bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin-bottom:6px}
.cc-next-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.cc-next{background:var(--bg-surface);border:1px solid var(--border-subtle);border-left:3px solid var(--accent-primary);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.cc-next.danger{border-left-color:var(--status-danger)}
.cc-next.warn{border-left-color:var(--accent-hover)}
.cc-next h3{margin:0;font-size:14px;font-weight:600}
.cc-alert{background:var(--bg-app);border:1px solid var(--status-danger);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.cc-alert-head{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.cc-tabs{display:flex;gap:0;border-bottom:1px solid var(--border-subtle);flex-wrap:wrap;margin-bottom:12px}
.tab-btn{background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--text-secondary);font:500 13px var(--font-sans);padding:8px 14px;cursor:pointer}
.tab-btn:hover{color:var(--text-primary)}
.tab-btn.active{color:var(--text-primary);border-bottom-color:var(--accent-primary)}
.cc-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--text-secondary)}
.cc-stat{display:flex;flex-direction:column;gap:4px;background:var(--bg-app);border:1px solid var(--border-subtle);border-radius:var(--r);padding:10px;text-align:center}
.cc-stat b{font:600 16px var(--font-mono);color:var(--text-primary)}
.cc-stat span{font-size:11px;color:var(--text-muted)}
@media (max-width:900px){ .cc-grid{grid-template-columns:1fr} }

/* ---------- MOBILE: barra inferior ---------- */
@media (max-width:767px){
  .topbar{padding:0 12px;gap:12px}
  .brand-name{display:none}
  .planet{max-width:130px;font-size:12px}
  .res-box{min-width:0;padding:0 10px}
  .layout{flex-direction:column}
  .sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:60px;border-right:0;border-top:1px solid var(--border-subtle);padding:0;z-index:30;overflow:visible}
  .sidebar nav{flex-direction:row;height:100%;gap:0;overflow-x:auto;scrollbar-width:none}
  .nav-item{flex:0 0 68px;flex-direction:column;justify-content:center;gap:2px;height:60px;padding:4px 2px;text-align:center;border-left:0;border-top:2px solid transparent;font-size:9px}
  .nav-item.active{border-top-color:var(--accent-primary)}

<body>
<div id="start" class="start" hidden>
  <section class="start-card" aria-labelledby="start-title">

    <p class="start-tag">Conquista el universo y construye tu imperio.</p>

      <button class="btn inline" id="tab-login" type="button">Iniciar sesión</button>
      <button class="btn inline secondary" id="tab-reg" type="button">Registrarse</button>
    </div>

      <button class="btn" id="auth-submit" type="submit">Entrar</button>
    </form>
    <button class="btn-quick" id="auth-quick" type="button" title="Entra con una cuenta de prueba sin registrarte">
      <svg width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.2 1.8 3.6 10.2h4.8l-.8 6 6.6-8.4H9.4z"/></svg>
      Acceso rápido de prueba

    <p class="start-foot">Cada cuenta tiene su propia partida guardada en este navegador.</p>
  </section>
</div>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="4"/><ellipse cx="9" cy="9" rx="8" ry="3" transform="rotate(-20 9 9)"/></svg>

    <div class="resources" id="resources">

        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1.8 15.3 5.3v7.4L9 16.2l-6.3-3.5V5.3z"/><path d="M2.7 5.3 9 8.8l6.3-3.5M9 8.8v7.4"/></svg>

      </div>
      <div class="res-box" style="color:var(--res-crystal)" title="Cristal">

</div>

const icon = n => `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ============ FÓRMULAS (MOTOR XNOVA) ============ */
const pw = n => n * Math.pow(1.1, n);                       // nivel * 1.1^nivel
const F = {
  hourlyMetal:   L => 30 + (30 * pw(L)),                    // 30 + (30 * nivel * 1.1^nivel)
  hourlyCrystal: L => 15 + (20 * pw(L)),                    // 15 + (20 * nivel * 1.1^nivel)
  hourlyDeut:    L => (10 * pw(L)) * 1.2,                   // (10 * nivel * 1.1^nivel) * 1.2
  solar:         L => 20 * pw(L),                           // energía planta solar
  consMetal:     L => 10 * pw(L),                           // consumo mina metal
  consCrystal:   L => 10 * pw(L),                           // consumo mina cristal
  consDeut:      L => 20 * pw(L),                            // consumo sintetizador
  fusE:          L => 30 * L * Math.pow(1.05, L),           // energía del Reactor de Fusión
  fusD:          L => 10 * pw(L)                            // deuterio/h del Reactor de Fusión
};
// Capacidad de almacenes/tanques (fórmula dada)
const capOf = L => 100000 + 50000 * Math.floor(Math.pow(1.6, L));
// Costos: fl(base, factor)(N) = Math.floor(base * factor^(N-1))
const fl = (base, mult) => N => Math.floor(base * Math.pow(mult, N - 1));

function loadGame(override){

    const d = JSON.parse(raw);
    if (d.prod) state.prod = Object.assign({mm:100,mc:100,ds:100,sol:100,fus:100}, d.prod);
    if (d.planets && d.planets.length){
      state.planets = d.planets;
      state.active = d.active || 0;
      state.planets.forEach(ensureLevels);
      bindActive();
    }
    if (d.moves) state.moves = d.moves;
    if (d.inbox) state.inbox = d.inbox;
    if (d.profile) state.profile = d.profile;
    if (d.wallet) state.wallet = d.wallet;
    if (d.txs) state.txs = d.txs;
    if (d.officers) state.officers = d.officers;
    if (d.empireClass !== undefined) state.empireClass = d.empireClass;
    if (d.vacation !== undefined) state.vacation = d.vacation;
    if (d.stats) state.stats = d.stats;
    if (d.referrals) state.referrals = d.referrals;
    if (d.market) state.market = d.market;
    if (d.galaxy) state.galaxy = {g:d.galaxy.g || 1, s:d.galaxy.s || 1, looted:d.galaxy.looted || {}, colonies:d.galaxy.colonies || {}, dmg:d.galaxy.dmg || {}};
    if (d.debris) state.debris = d.debris;
    if (d.speed) state.speed = d.speed;
    if (typeof d.simSec === 'number') state.simSec = d.simSec;
    if (typeof d.spent === 'number') state.spent = d.spent;
    if (d.daily) state.daily = d.daily;

const PLAYERS = ['Orión_77','NovaKai','Ferrum_X','Lyra Nocturna','Sigma-9','Kael Vorn','ZeroDelta','Mirai_Q','Aster Ron','Tauro Prime','Vexa_12','Helio Dorn'];
const ALLIANCES = ['','','','NXS','VRD','ORB','AST'];
const PLANET_NAMES = ['Nyx','Brenna','Hadar','Kessel','Orbis','Tarsa','Vael','Oriax'];

// Generador pseudoaleatorio mulberry32: misma semilla, mismos resultados
function rng(seed){
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function systemPlanets(g, s){
  const out = [];
  for (let p = 1; p <= 15; p++){
    const r = rng(g * 100003 + s * 1009 + p * 31 + 7);
    const id = g + ':' + s + ':' + p;
    if (r() > 0.55){ out.push({pos:p, id, occupied:false}); continue; }
    const name = PLANET_NAMES[Math.floor(r() * PLANET_NAMES.length)] + ' ' + g + '.' + s + '.' + p;
    const owner = PLAYERS[Math.floor(r() * PLAYERS.length)];
    const alli = ALLIANCES[Math.floor(r() * ALLIANCES.length)];
    const res = {metal:Math.floor(r()*250000), crystal:Math.floor(r()*150000), deut:Math.floor(r()*60000)};
    const fleet = {nc:Math.floor(r()*12), cz:Math.floor(r()*30), cr:Math.floor(r()*4), sp:Math.floor(r()*6)};
    const defense = {lm:Math.floor(r()*40)};
    out.push({pos:p, id, occupied:true, name, owner, alli, res, fleet, defense});
  }
  return out;
}

function clampInt(v, min, max){
  const n = Math.floor(Number(v));
  return Math.min(max, Math.max(min, Number.isFinite(n) ? n : min));
}

  const price = Math.max(1, Math.round(qty * (0.2 + Math.random() * 0.3)));

function publishOffer(){
  const res = document.getElementById('m-res').value;
  const qty = Math.floor(Number(document.getElementById('m-qty').value));
  const price = Math.floor(Number(document.getElementById('m-price').value));
  if (!(qty > 0)) return setStatus('La cantidad debe ser mayor que 0.', true);
  if (!(price > 0)) return setStatus('El precio debe ser mayor que 0 Tokens.', true);
  if (state.res[res] < qty) return setStatus('No tienes suficiente ' + RES_NAME[res] + ' en el planeta.', true);
  state.res[res] -= qty;
  state.market.own.push({id:'own' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), owner:'Tú', res, qty, price});
  state.dirtyMarket = true;
  bumpMission('offer', 1);
  setStatus('Oferta publicada.');
  renderBook();
  refresh();
}
function buyOffer(id){
  const o = state.market.rivals.find(x => x.id === id);
  if (!o) return;
  if (state.res.token < o.price) return setStatus('Te faltan ' + fmt(o.price - state.res.token) + ' Tokens para esta compra.', true);
  state.res.token -= o.price;
  state.res[o.res] = Math.min(capOf(state.lvl[CAP_KEY[o.res]]), state.res[o.res] + o.qty);
  state.market.rivals = state.market.rivals.filter(x => x.id !== id);
  state.dirtyMarket = true;
  setStatus('Compraste ' + fmt(o.qty) + ' de ' + RES_NAME[o.res] + '.');
  renderBook();
  refresh();
}
function cancelOffer(id){
  const o = state.market.own.find(x => x.id === id);
  if (!o) return;
  state.res[o.res] = Math.min(capOf(state.lvl[CAP_KEY[o.res]]), state.res[o.res] + o.qty);
  state.market.own = state.market.own.filter(x => x.id !== id);
  state.dirtyMarket = true;
  setStatus('Oferta cancelada. Recursos devueltos al planeta.');
  renderBook();
  refresh();
}
// Simulación: tus ofertas se venden con el tiempo y los jugadores simulados reponen el libro
function marketTick(dt){
  let changed = false;
  state.market.own = state.market.own.filter(o => {
    if (Math.random() < 0.01 * dt) { state.res.token += o.price; changed = true; return false; }
    return true;
  });
  if (state.market.rivals.length < 6 && Math.random() < 0.02 * dt) { state.market.rivals.push(randomOffer()); changed = true; }
  if (changed) state.dirtyMarket = true;
}

const EXP_SHIPS = ['nc','cz','cr','sp'];
const MISSIONS = [
  {id:'upgrade', label:'Mejorar 1 edificio', target:1, reward:{metal:2000, crystal:1000, token:20}},
  {id:'ships', label:'Construir 5 naves', target:5, reward:{crystal:3000, token:30}},

  {id:'offer', label:'Publicar 1 oferta P2P', target:1, reward:{metal:1000, token:25}}
];

function fmtClock(t){
  const day = Math.floor(t / 86400) + 1;
  const hh = Math.floor((t % 86400) / 3600);
  const mm = Math.floor((t % 3600) / 60);
  return 'D' + day + ' ' + String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function addRes(k, n){
  if (k === 'token'){ state.res.token += n; return; }
  state.res[k] = Math.min(capOf(state.lvl[CAP_KEY[k]]), state.res[k] + n);
}
function formatRewards(r){
  return Object.keys(r).map(k => '+' + fmt(r[k]) + ' ' + (k === 'token' ? 'Tokens' : RES_NAME[k])).join(' · ');
}

/* ----- Misiones diarias (día simulado de 24 h) ----- */
function checkDay(){
  const day = Math.floor(state.simSec / 86400);
  if (state.daily.day !== day) state.daily = {day, p:{upgrade:0, ships:0, expe:0, offer:0}, c:{}};
}
function bumpMission(id, n){
  checkDay();
  const m = MISSIONS.find(x => x.id === id);
  if (!m) return;
  state.daily.p[id] = Math.min(m.target, (state.daily.p[id] || 0) + n);
}
function missionRow(m){
  return `
  <div class="mission">
    <div class="mission-head"><span>${m.label}</span><span class="mono" data-mprog="${m.id}"></span></div>
    <div class="bar"><span data-mbar="${m.id}"></span></div>
    <div class="mission-foot">
      <span class="muted">Recompensa: ${formatRewards(m.reward)}</span>
      <button class="btn inline" data-claim="${m.id}">Reclamar Recompensa</button>
    </div>
  </div>`;
}
function refreshMissions(){
  checkDay();
  MISSIONS.forEach(m => {
    const p = state.daily.p[m.id] || 0;
    const done = p >= m.target, claimed = !!state.daily.c[m.id];
    const prog = document.querySelector('[data-mprog="' + m.id + '"]');
    if (prog) prog.textContent = p + ' / ' + m.target;
    const bar = document.querySelector('[data-mbar="' + m.id + '"]');
    if (bar) bar.style.width = Math.min(100, p / m.target * 100) + '%';
    const btn = document.querySelector('[data-claim="' + m.id + '"]');
    if (btn){
      btn.disabled = !done || claimed;
      btn.textContent = claimed ? 'Reclamado' : 'Reclamar Recompensa';
    }
  });
}
function claimMission(id){
  checkDay();
  const m = MISSIONS.find(x => x.id === id);
  if (!m) return;
  if (state.daily.c[id]) return setStatus('Recompensa ya reclamada hoy.', true);
  if ((state.daily.p[id] || 0) < m.target) return setStatus('Misión aún no completada.', true);
  Object.keys(m.reward).forEach(k => addRes(k, m.reward[k]));
  state.daily.c[id] = true;
  refresh();
  setStatus('Recompensa de "' + m.label + '" reclamada: ' + formatRewards(m.reward) + '.');
}

/* Resultado ponderado por Astrofísica: más nivel, más hallazgos y menos eventos hostiles */
function launchExpedition(){
  if (state.lvl.ap < 1) return setStatus('Requiere Astrofísica nivel 1.', true);
  const sel = {};
  let total = 0;
  EXP_SHIPS.forEach(k => {
    const inp = document.querySelector('[data-exp="' + k + '"]');
    const q = clampInt(inp ? inp.value : 0, 0, state.fleet[k] || 0);
    if (inp) inp.value = q;
    sel[k] = q;
    total += q;
  });
  if (total < 1) return setStatus('Selecciona al menos una nave del hangar.', true);
  EXP_SHIPS.forEach(k => { state.fleet[k] -= sel[k]; });        // las naves salen del hangar
  const L = state.lvl.ap;
  const w = {res:35 + 2 * L, tok:20 + 2 * L, ship:10 + L, event:Math.max(10, 35 - 3 * L)};
  let roll = Math.random() * (w.res + w.tok + w.ship + w.event);
  let outcome = 'event';
  for (const key of ['res','tok','ship','event']){
    roll -= w[key];
    if (roll < 0){ outcome = key; break; }
  }
  if (outcome === 'res'){
    const r = RES[Math.floor(Math.random() * RES.length)];
    const amount = Math.floor((2000 + Math.random() * 8000) * (1 + 0.1 * L) * (1 + total / 50) * expMult());
    addRes(r, amount);
    pushLog('ok', 'Hallazgo: +' + fmt(amount) + ' de ' + RES_NAME[r] + ' en un asteroide a la deriva.');
  } else if (outcome === 'tok'){
    const t = Math.floor((5 + Math.floor(Math.random() * 41)) * expMult());
    addRes('token', t);
    pushLog('ok', 'Hallazgo: +' + t + ' Tokens de un mercader perdido.');
  } else if (outcome === 'ship'){
    const k = Math.random() < 0.5 ? 'nc' : 'cz';
    state.fleet[k] = (state.fleet[k] || 0) + 1;
    pushLog('ok', 'Hallazgo: una ' + SHIPS[k].name + ' abandonada se une a tu hangar.');
  } else if (Math.random() < 0.5){
    let left = Math.max(1, Math.round(total * 0.2));
    EXP_SHIPS.forEach(k => { const take = Math.min(sel[k], left); sel[k] -= take; left -= take; });
    pushLog('bad', 'Piratas: emboscada en el Espacio Profundo. Se perdieron naves enviadas.');
  } else {
    pushLog('warn', 'Anomalía espacial: sin hallazgos. Las naves regresan intactas.');
  }
  EXP_SHIPS.forEach(k => { state.fleet[k] = (state.fleet[k] || 0) + sel[k]; });   // regresan al hangar
  bumpMission('expe', 1);
  renderLog();
  refresh();
  setStatus('Expedición completada.');
}

  a.members.push('Tú');
  state.alliance = {tag:a.tag, name:a.name, msgs:[{author:'Sistema', text:'Bienvenido a la alianza.', t:state.simSec}], fortressNext:0};
  state.wallDirty = true;

  setStatus('Te uniste a [' + a.tag + '] ' + a.name + '.');

  setStatus('Abandonaste la alianza.');

/* ============ RANKING Y POOL DE PREMIOS ============ */
const POOL_DAILY = 10000;
const H15 = Array.from({length:15}, (_, i) => 1 / (i + 1)).reduce((a, b) => a + b, 0);

// Reparto proporcional a 1/puesto dentro del Top 15
function prizeFor(rank){
  return Math.floor(POOL_DAILY * (1 / rank) / H15);
}

function ensureSocial(){
  if (!state.alliances || !state.alliances.length){
    state.alliances = [
      {name:'Nexus Solar', tag:'NXS', members:['NovaKai','Kael Vorn','Sigma-9']},
      {name:'Verdant Orbit', tag:'VRD', members:['Lyra Nocturna','Tauro Prime']},
      {name:'Órbita Basalto', tag:'ORB', members:['Ferrum_X','Helio Dorn','Vexa_12']},
      {name:'Pacto Astral', tag:'AST', members:['Aster Ron','ZeroDelta']}
    ];
  }
  if (!state.ranking){
    const names = PLAYERS.concat(['Draco_3','Lumen X','Rhea-Cy']).slice(0, 14);
    state.ranking = {rivals: names.map(n => {
      const al = state.alliances.find(a => a.members.includes(n));
      return {name:n, alli: al ? al.tag : '', pts: Math.floor(2000 + Math.random() * 28000), rate: 0.5 + Math.random() * 6};
    })};
  }
}

function rankEntries(){
  ensureSocial();
  const rows = state.ranking.rivals.map(r => ({name:r.name, alli:r.alli || '—', pts:Math.floor(r.pts), me:false}));
  rows.push({name:'Tú', alli: state.alliance ? state.alliance.tag : '—', pts:Math.floor(state.spent / 1000), me:true});
  rows.sort((x, y) => y.pts - x.pts);
  return rows;
}
function myRank(){
  return rankEntries().findIndex(r => r.me) + 1;
}
function rankText(a){
  const rank = myRank();
  if (a === 'me') return '#' + rank;
  return fmt(prizeFor(rank)) + ' Tokens';
}

/* Oficiales: los temporales usan días simulados; los permanentes se compran una vez */
function officerOn(k){
  const o = state.officers[k];
  return OFFICERS[k].timed ? o > state.simSec : o === true;
}
function offStatus(k){
  if (!OFFICERS[k].timed) return state.officers[k] === true ? 'Permanente · activo' : 'No contratado';
  const rem = state.officers[k] - state.simSec;
  if (rem <= 0) return 'No contratado';
  const d = Math.floor(rem / DAY), h = Math.floor((rem % DAY) / 3600), m = Math.floor((rem % 3600) / 60);
  return 'Activo · ' + d + 'd ' + h + 'h ' + m + 'm (sim.)';
}
function maxFleets(){ return 2 + (officerOn('adm') ? 2 : 0); }
function effEs(){ return state.lvl.es + (officerOn('tec') ? 2 : 0); }
function expMult(){ return state.empireClass === 'discoverer' ? 1.2 : 1; }

function hireOfficer(k){
  const O = OFFICERS[k];
  if (!O.timed && state.officers[k] === true) return setStatus(O.name + ' ya está contratado.', true);
  if (state.res.token < O.cost) return setStatus('Necesitas ' + O.cost + ' Tokens para contratar al ' + O.name + '.', true);
  state.res.token -= O.cost;
  if (O.timed) state.officers[k] = Math.max(state.simSec, state.officers[k]) + 7 * DAY;
  else state.officers[k] = true;
  addTx('Oficial · ' + O.name, -O.cost, 'Completado');
  render();
  setStatus(O.name + (O.timed ? ' contratado: 7 días añadidos.' : ' contratado de forma permanente.'));
}

function addTx(type, amount, status){
  state.txs.unshift({t:state.simSec, type, amount, status});
  if (state.txs.length > 100) state.txs.length = 100;
}
function linkWallet(){
  const v = (document.getElementById('w-addr').value || '').trim();
  if (!/^0x[0-9a-fA-F]{40}$/.test(v)) return setStatus('La dirección debe tener formato 0x seguido de 40 caracteres hexadecimales.', true);
  state.wallet.address = v;
  render();
  setStatus('Wallet vinculada (red BSC / BEP-20).');
}
function withdraw(){
  const amount = Math.floor(Number(document.getElementById('w-amount').value));
  if (!state.wallet.address) return setStatus('Vincula una wallet antes de retirar.', true);
  if (!(amount >= 100)) return setStatus('El retiro mínimo es de 100 Tokens.', true);
  if (state.res.token < amount) return setStatus('Saldo insuficiente.', true);
  state.res.token -= amount;
  const a = state.wallet.address;
  addTx('Retiro a ' + a.slice(0, 6) + '…' + a.slice(-4), -amount, 'Pendiente (simulado)');
  render();
  setStatus('Retiro solicitado: ' + fmt(amount) + ' Tokens.');
}
function simulateDeposit(){
  state.res.token += 100;
  addTx('Depósito', 100, 'Completado (simulado)');
  render();
  setStatus('Depósito simulado: +100 Tokens.');
}
function swap(){
  const res = document.getElementById('sw-res').value;
  const dir = document.getElementById('sw-dir').value;
  const pk = Math.floor(Number(document.getElementById('sw-qty').value));
  if (!(pk >= 1)) return setStatus('Indica al menos 1 paquete.', true);
  const units = SWAP_UNITS * pk;
  if (dir === 'buy'){
    const cost = SWAP_BUY * pk;
    if (state.res.token < cost) return setStatus('Tokens insuficientes para ese swap.', true);
    if (state.res[res] + units > capOf(state.lvl[CAP_KEY[res]])) return setStatus('El almacén no tiene espacio para ' + fmt(units) + ' unidades.', true);
    state.res.token -= cost;
    addRes(res, units);
    addTx('Swap compra · ' + RES_NAME[res] + ' ' + fmt(units), -cost, 'Completado');
  } else {
    if (state.res[res] < units) return setStatus('No tienes ' + fmt(units) + ' de ' + RES_NAME[res] + ' en este planeta.', true);
    const gain = SWAP_SELL * pk;
    state.res[res] -= units;
    state.res.token += gain;
    addTx('Swap venta · ' + RES_NAME[res] + ' ' + fmt(units), gain, 'Completado');
  }
  render();
  setStatus('Swap completado.');
}

/* ============ MÓDULOS DEL MOTOR (FASE 6) ============ */
/* ============ CÁLCULOS ============ */
function makeLvl(home){
  const L = {};
  [...BUILD_KEYS, ...MOON_KEYS, ...TECH_KEYS].forEach(k => { L[k] = 0; });
  if (home){ L.mm = 1; L.mc = 1; L.sol = 1; }
  return L;
}
function makeFleet(){
  const f = {};
  UNIT_KEYS.forEach(k => { f[k] = 0; });
  return f;
}
// Completa niveles, flota y estado de construcción de un planeta (partidas antiguas incluidas)
function ensureLevels(P){
  P.lvl = P.lvl || makeLvl(false);
  [...BUILD_KEYS, ...MOON_KEYS, ...TECH_KEYS].forEach(k => { if (typeof P.lvl[k] !== 'number') P.lvl[k] = 0; });
  P.fleet = P.fleet || makeFleet();
  UNIT_KEYS.forEach(k => { if (typeof P.fleet[k] !== 'number') P.fleet[k] = 0; });
  P.res = P.res || {metal:0, crystal:0, deut:0, token:0};
  if (P.queue === undefined) P.queue = null;
  if (P.moon === undefined) P.moon = false;
}
function activePlanet(){ return state.planets[state.active] || state.planets[0]; }
// Campos: planeta 163 + 5 por Terraformer; luna 1 + 3 por Base Lunar
function maxFields(P){ return P.moon ? 1 + 3 * (P.lvl.lb || 0) : 163 + 5 * (P.lvl.ter || 0); }
function usedFields(P){ return (P.moon ? MOON_KEYS : BUILD_KEYS).reduce((x, k) => x + (P.lvl[k] || 0), 0); }

function nameOf(k){
  const P = activePlanet();
  if (P && P.moon && MOON_NAME[k]) return MOON_NAME[k];
  return (ITEMS[k] || SHIPS[k] || {}).name || k;
}
function reqOk(reqs, L){
  L = L || state.lvl;
  return Object.keys(reqs || {}).every(k => (L[k] || 0) >= reqs[k]);
}
function reqText(reqs){
  return Object.keys(reqs || {}).map(k => nameOf(k) + ' nv ' + reqs[k]).join(' · ') || 'Sin requisitos';
}
// Línea de requisitos con color según se cumplan
function reqLine(reqs){
  const keys = Object.keys(reqs || {});
  if (!keys.length) return '';
  return `<div class="stat-line">Requiere: ${keys.map(k => `<span class="${(state.lvl[k] || 0) >= reqs[k] ? 'tag-ok' : 'tag-bad'}">${nameOf(k)} nv ${reqs[k]}</span>`).join(' · ')}</div>`;
}

// Porcentaje de producción elegido por edificio (100 % por defecto)
function prodPct(k){ return state.prod && state.prod[k] != null ? state.prod[k] : 100; }
function prodFactor(k){ return prodPct(k) / 100; }
function energy(){
  const P = activePlanet(), L = state.lvl;
  if (P && P.moon) return {prod:0, cons:0, eff:1, deficit:false};
  const solar = F.solar(L.sol) * (1 + 0.05 * L.en) * (1 + (officerOn('eng') ? 0.20 : 0)) * prodFactor('sol');
  const prod = solar + F.fusE(L.fus || 0) * prodFactor('fus') + 5 * (state.fleet.sat || 0);
  const cons = F.consMetal(L.mm) * prodFactor('mm') + F.consCrystal(L.mc) * prodFactor('mc') + F.consDeut(L.ds) * prodFactor('ds');
  const deficit = cons > prod;
  const eff = deficit ? prod / cons : 1;
  return {prod, cons, eff, deficit};
}
// Producción por hora efectiva (sin factor de velocidad). Las lunas no producen recursos.
function rates(){
  const P = activePlanet(), L = state.lvl, e = energy();
  if (P && P.moon) return {metal:0, crystal:0, deut:0, fusCons:0, e};
  return {
    metal:   F.hourlyMetal(L.mm) * e.eff * (1 + allianceBonus()) * prodFactor('mm'),
    crystal: F.hourlyCrystal(L.mc) * e.eff * (1 + allianceBonus()) * prodFactor('mc'),
    deut:    F.hourlyDeut(L.ds) * (1 + 0.05 * L.cm) * e.eff * (1 + allianceBonus()) * prodFactor('ds'),
    fusCons: F.fusD(L.fus || 0),
    e
  };
}
function reqMet(id){ return reqOk(ITEMS[id] && ITEMS[id].reqs); }
function canAfford(id){
  const it = ITEMS[id];
  if (!it || !reqMet(id)) return false;
  if (it.view !== 'research' && usedFields(activePlanet()) + 1 > maxFields(activePlanet())) return false;
  const c = costOf(id, state.lvl[id] + 1);
  return RES.every(r => state.res[r] >= c[r]);
}

/* Tiempo de construcción en segundos simulados: (metal+cristal)/(2500·(1+robots)) horas,
   reducido por Fábrica de Nanobots (÷2 por nivel) y por Gravitón (-2 % por nivel). */
function buildSeconds(id, N){
  const c = costOf(id, N);
  const base = (c.metal + c.crystal) / (2500 * (1 + (state.lvl.rf || 0))) * 3600;
  const nan = Math.pow(0.5, state.lvl.nan || 0);
  const gv = 1 - 0.02 * (state.lvl.gv || 0);
  return Math.max(5, Math.ceil(base * nan * gv));
}

/* ============ ACCIONES ============ */
function upgrade(id){
  const it = ITEMS[id];
  if (!it || !canAfford(id)) return refresh();
  const N = state.lvl[id] + 1;
  const c = costOf(id, N);
  if (it.view === 'research'){
    RES.forEach(r => { state.res[r] -= c[r]; });
    state.lvl[id] = N;
    state.spent += c.metal + c.crystal + c.deut;
    return refresh();
  }
  const P = activePlanet();
  if (P.queue) return setStatus('Ya hay una construcción en curso en este planeta.', true);
  RES.forEach(r => { state.res[r] -= c[r]; });
  state.spent += c.metal + c.crystal + c.deut;
  bumpMission('upgrade', 1);
  P.queue = {id, end: state.simSec + buildSeconds(id, N), total: buildSeconds(id, N)};
  setStatus('Construcción iniciada: ' + it.name + ' nivel ' + N + '.');
  refresh();
}
// Cancela la construcción en curso y devuelve los recursos
function cancelBuild(){
  const P = activePlanet();
  if (!P.queue) return;
  const c = costOf(P.queue.id, P.lvl[P.queue.id] + 1);
  RES.forEach(r => { state.res[r] += c[r]; });
  state.spent -= c.metal + c.crystal + c.deut;
  P.queue = null;
  setStatus('Construcción cancelada. Recursos reembolsados.');
  refresh();
}
// Completa las construcciones cuyo tiempo simulado ha pasado, en todos los planetas y lunas
function processQueues(){
  state.planets.forEach(P => {
    const q = P.queue;
    if (!q || state.simSec < q.end) return;
    P.lvl[q.id] = (P.lvl[q.id] || 0) + 1;
    P.queue = null;
    setStatus('Construcción terminada: ' + ITEMS[q.id].name + ' nivel ' + P.lvl[q.id] + '.');
  });
}

function tick(){
  const now = performance.now();
  let dt = (now - state.last) / 1000;
  state.last = now;
  dt = Math.min(dt, 5);
  const r = rates();
  const k = state.vacation ? 0 : state.speed / 3600 * dt;
  state.stats.mined += (r.metal + r.crystal + r.deut) * k;
  const capM = capOf(state.lvl.sm), capC = capOf(state.lvl.sc), capD = capOf(state.lvl.tk);
  if (state.res.metal < capM) state.res.metal = Math.min(capM, state.res.metal + r.metal * k);
  if (state.res.crystal < capC) state.res.crystal = Math.min(capC, state.res.crystal + r.crystal * k);
  // El deuterio neto descuenta el consumo del Reactor de Fusión y nunca baja de cero
  const netD = (r.deut - r.fusCons) * k;
  const nd = state.res.deut + netD;
  state.res.deut = netD < 0 ? Math.max(0, nd) : (state.res.deut < capD ? Math.min(capD, nd) : state.res.deut);
  marketTick(dt);
  simTick(dt);
}

function simTick(dt){
  const sec = dt * state.speed;
  state.simSec += sec;
  checkDay();
  processQueues();
  ensureSocial();
  state.ranking.rivals.forEach(r => { r.pts += r.rate * sec; });
  if (state.alliance && Math.random() < 0.004 * dt){
    const entry = allianceEntry();
    const others = entry ? entry.members.filter(m => m !== 'Tú') : [];
    if (others.length){
      state.alliance.msgs.push({author:others[Math.floor(Math.random() * others.length)], text:ALLIANCE_MSGS[Math.floor(Math.random() * ALLIANCE_MSGS.length)], t:state.simSec});
      if (state.alliance.msgs.length > 50) state.alliance.msgs.splice(0, state.alliance.msgs.length - 50);
      state.wallDirty = true;
    }
  }
}

/* ============ PLANETAS, LUNAS Y ESCOMBROS ============ */
function ensurePlanets(){
  if (!state.planets || !state.planets.length){
    state.planets = [{name:'Ceres Prima [1:1:1]', coords:'1:1:1', res:state.res, lvl:state.lvl, fleet:state.fleet, queue:null, moon:false}];
    state.active = 0;
  }
  state.planets.forEach(ensureLevels);
  bindActive();
}

// Crea una luna en el planeta indicado (una por planeta)
function createMoon(idx){
  const P = state.planets[idx];
  if (!P || P.moon) return false;
  if (state.planets.some(x => x.moon && x.parent === P.coords)) return false;
  const base = P.name.split(' [')[0];
  const moon = {name:'Luna · ' + base, coords:P.coords + 'L', parent:P.coords, moon:true, queue:null,
                res:{metal:0, crystal:0, deut:0, token:0}, lvl:makeLvl(false), fleet:makeFleet()};
  TECH_KEYS.forEach(k => { moon.lvl[k] = P.lvl[k] || 0; });
  state.planets.push(moon);
  renderPlanetSelect();
  return true;
}
// Prueba manual: forma una luna en el planeta activo
function simMoonDebug(){
  const P = activePlanet();
  if (P.moon) return setStatus('Las lunas no pueden orbitar otra luna.', true);
  if (!createMoon(state.active)) return setStatus('Este planeta ya tiene una luna.', true);
  setStatus('¡Formación de luna simulada! Nueva luna en órbita de ' + P.name.split(' [')[0] + '.');
  refresh();
}

function addDebris(id, d){
  const D = state.debris[id] = state.debris[id] || {metal:0, crystal:0};
  D.metal += Math.floor(d.metal || 0);
  D.crystal += Math.floor(d.crystal || 0);
}
function debrisAt(id){ return state.debris[id] || {metal:0, crystal:0}; }
// Capacidad de carga de una flota (con Tecnología de Hiperespacio)
function cargoOf(fleet){
  const hy = state.lvl.hy || 0;
  return Object.keys(fleet || {}).reduce((x, k) => x + (fleet[k] || 0) * (SHIPS[k] ? SHIPS[k].cargo || 0 : 0), 0) * (1 + 0.05 * hy);
}
// Distancia entre coordenadas [g,s,p] y tiempo de vuelo real en segundos
function parseCoords(str){
  const m = /^(\d+):(\d+):(\d+)/.exec(String(str || ''));
  return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
}
function distanceOf(a, b){
  if (!a || !b) return 0;
  return Math.abs(a[0] - b[0]) * 15 + Math.abs(a[1] - b[1]) * 0.5 + Math.abs(a[2] - b[2]) * 2;
}
function travelSeconds(dist){ return Math.round(20 + dist); }

/* ============ MOTOR DE COMBATE Y SIMULADOR ============ */
// Valores de combate por unidad (ataque, escudo y estructura) tomados del catálogo de naves y defensas
const COMBAT = {};
Object.keys(SHIPS).forEach(k => { const s = SHIPS[k]; if (!s.noCombat) COMBAT[k] = {a:s.a, sh:s.sh, s:s.s}; });
const COMBAT_KEYS = Object.keys(COMBAT);

function buildUnits(src, t, mult){
  mult = mult || {a:1, sh:1};
  t = t || {};
  const shMul = (1 + 0.1 * (t.escudos || 0)) * mult.sh, sMul = 1 + 0.1 * (t.blindaje || 0);
  return COMBAT_KEYS.filter(k => (src[k] || 0) > 0).map(k => {
    const c = COMBAT[k], n = src[k];
    const techLvl = TECH_UNIT[k] ? (t[TECH_UNIT[k]] || 0) : 0;
    const aMul = (1 + 0.1 * (t.armas || 0)) * (1 + 0.05 * techLvl) * mult.a;
    return {k, n0:n, n, a:c.a * aMul, sh:c.sh * shMul, s:c.s * sMul, hp:n * c.s * sMul, sp:0};
  });
}

// El daño primero consume el escudo del grupo y luego el casco, en proporción a su casco
function applyDamage(units, dmg){
  const total = units.reduce((x, u) => x + Math.max(0, u.hp), 0);
  if (dmg <= 0 || total <= 0) return;
  units.forEach(u => {
    if (u.hp <= 0 || u.n <= 0) return;
    const share = dmg * (u.hp / total);
    const absorbed = Math.min(share, u.sp);
    u.sp -= absorbed;
    u.hp = Math.max(0, u.hp - (share - absorbed));
    u.n = Math.ceil(u.hp / u.s - 1e-9);
  });
}

function simulateBattle(attSrc, attT, defSrc, defT, bonus){
  bonus = bonus || {};
  const A = buildUnits(attSrc, attT, bonus.att), D = buildUnits(defSrc, defT, bonus.def);
  const alive = list => list.reduce((x, u) => x + u.n, 0);
  const log = [];
  for (let round = 1; round <= 6; round++){
    if (alive(A) <= 0 || alive(D) <= 0) break;
    A.forEach(u => { u.sp = u.n * u.sh; });
    D.forEach(u => { u.sp = u.n * u.sh; });
    const dmgA = A.reduce((x, u) => x + u.n * u.a, 0);
    const dmgD = D.reduce((x, u) => x + u.n * u.a, 0);
    applyDamage(D, dmgA);
    applyDamage(A, dmgD);
    log.push('Ronda ' + round + ': el atacante inflige ' + fmt(dmgA) + ' de daño y el defensor ' + fmt(dmgD) + '.');
  }
  const aStart = {}, aEnd = {}, dStart = {}, dEnd = {};
  A.forEach(u => { aStart[u.k] = u.n0; aEnd[u.k] = u.n; });
  D.forEach(u => { dStart[u.k] = u.n0; dEnd[u.k] = u.n; });
  const aN = alive(A), dN = alive(D);
  const aHp = A.reduce((x, u) => x + u.hp, 0), dHp = D.reduce((x, u) => x + u.hp, 0);
  const share = (aHp + dHp) > 0 ? aHp / (aHp + dHp) : 0.5;
  let winner;
  if (aN > 0 && dN === 0) winner = 'attacker';
  else if (dN > 0 && aN === 0) winner = 'defender';
  else if (aN === 0 && dN === 0) winner = 'draw';
  else winner = Math.abs(share - 0.5) < 0.05 ? 'draw' : (share > 0.5 ? 'attacker' : 'defender');
  let lostA = 0, lostD = 0, debrisM = 0, debrisC = 0;
  A.forEach(u => { lostA += u.n0 - u.n; });
  D.forEach(u => { lostD += u.n0 - u.n; });
  [...A, ...D].forEach(u => {
    if (SHIPS[u.k].defense) return;              // las defensas no generan escombros
    const lost = u.n0 - u.n, c = SHIPS[u.k].cost;
    debrisM += lost * (c.metal || 0) * 0.3;
    debrisC += lost * (c.crystal || 0) * 0.3;
  });
  return {winner, winPct:Math.round(share * 100), aStart, aEnd, dStart, dEnd, lostA, lostD,
          debris:{metal:Math.floor(debrisM), crystal:Math.floor(debrisC)}, log};
}

function resultHTML(r){
  const label = {attacker:'Atacante', defender:'Defensor', draw:'Empate'}[r.winner];
  const cls = r.winner === 'attacker' ? 'tag-ok' : (r.winner === 'defender' ? 'tag-bad' : 'muted');
  const units = COMBAT_KEYS.filter(k => (r.aStart[k] || 0) + (r.dStart[k] || 0) > 0).map(k =>
    `<div><span>${SHIPS[k].name}</span><span>A ${fmt(r.aStart[k] || 0)}→${fmt(r.aEnd[k] || 0)} · D ${fmt(r.dStart[k] || 0)}→${fmt(r.dEnd[k] || 0)}</span></div>`).join('');
  return `
    <div class="rows">
      <div><span>Ganador</span><span class="${cls}">${label}</span></div>
      <div><span>Probabilidad de victoria atacante</span><span>${r.winPct} %</span></div>
      <div><span>Bajas atacante</span><span>${fmt(r.lostA)} unidades</span></div>
      <div><span>Bajas defensor</span><span>${fmt(r.lostD)} unidades</span></div>
      <div><span>Escombros</span><span>${fmt(r.debris.metal)} Metal · ${fmt(r.debris.crystal)} Cristal</span></div>
    </div>
    <p class="muted" style="font-size:12px;margin:12px 0 0">A = atacante, D = defensor (inicial → final)</p>
    <div class="rows" style="margin-top:8px">${units || '<div><span>Sin unidades</span><span>—</span></div>'}</div>
    <div class="rows" style="margin-top:8px">${r.log.map(l => `<div style="display:block">${esc(l)}</div>`).join('') || '<div>Sin rondas</div>'}</div>`;
}
function lootRows(loot){
  return `<div class="rows" style="margin-top:8px">${RES.map(k => `<div><span>Botín de ${RES_NAME[k]}</span><span>${fmt(loot[k] || 0)}</span></div>`).join('')}</div>`;
}

/* ----- Resolución de ataques (instantáneos o por misión) ----- */
// Combate contra un planeta rival: aplica pérdidas, escombros y botín. Devuelve supervivientes y botín.
function resolveAttack(T, att){
  const L = state.lvl;
  const gen = state.empireClass === 'general' ? 1.15 : 1;
  const attT = {armas:L.cp || 0, escudos:L.bl || 0, blindaje:0, lz:L.lz || 0, io:L.io || 0, pl:L.pl || 0};
  const def = {};
  UNIT_KEYS.forEach(k => { const n = (T.fleet && T.fleet[k]) || (T.defense && T.defense[k]) || 0; if (n > 0) def[k] = n; });
  const r = simulateBattle(att, attT, def, {armas:0, escudos:0, blindaje:0}, {att:{a:gen, sh:gen}});
  // Pérdidas del rival persistentes en la galaxia
  const dmg = state.galaxy.dmg = state.galaxy.dmg || {};
  const rec = dmg[T.id] = dmg[T.id] || {};
  Object.keys(r.dStart).forEach(k => { const lost = (r.dStart[k] || 0) - (r.dEnd[k] || 0); if (lost > 0) rec[k] = (rec[k] || 0) + lost; });
  if (r.debris.metal + r.debris.crystal > 0) addDebris(T.id, r.debris);
  const loot = {metal:0, crystal:0, deut:0};
  if (r.winner === 'attacker'){
    let cap = cargoOf(r.aEnd);
    RES.forEach(k => {
      const take = Math.min(Math.floor((T.res[k] || 0) * 0.5), Math.max(0, Math.floor(cap)));
      loot[k] = take; cap -= take;
    });
    const looted = state.galaxy.looted[T.id] = state.galaxy.looted[T.id] || {metal:0, crystal:0, deut:0};
    RES.forEach(k => { looted[k] = (looted[k] || 0) + loot[k]; });
    state.stats.wins++;
  }
  const survivors = {};
  Object.keys(r.aEnd).forEach(k => { if (r.aEnd[k] > 0) survivors[k] = r.aEnd[k]; });
  return {result:r, loot, survivors};
}

// Ataque instantáneo desde la Galaxia: usa todas las naves móviles del planeta activo
function attackPlanet(id){
  const T = planetById(id);
  if (!T.occupied) return setStatus('Ese espacio está vacío.', true);
  if (T.mine) return setStatus('No puedes atacar tu propia colonia.', true);
  const P = activePlanet();
  const att = {};
  MOVE_SHIPS.forEach(k => { if ((state.fleet[k] || 0) > 0) att[k] = state.fleet[k]; });
  if (!Object.keys(att).some(k => SHIPS[k].a > 0)) return setStatus('Necesitas naves de ataque en el hangar del planeta activo.', true);
  MOVE_SHIPS.forEach(k => { state.fleet[k] = 0; });
  const out = resolveAttack(T, att);
  Object.keys(out.survivors).forEach(k => { state.fleet[k] = (state.fleet[k] || 0) + out.survivors[k]; });
  RES.forEach(k => { P.res[k] = Math.min(capOf(P.lvl[CAP_KEY[k]]), (P.res[k] || 0) + out.loot[k]); });
  pushInbox({kind:'battle', title:'Ataque · ' + T.name + ' (' + T.id + ')', t:state.simSec, data:null,
             html: resultHTML(out.result) + lootRows(out.loot)});
  openModal(out.result.winner === 'attacker' ? 'Victoria en batalla' : 'Derrota en batalla', `
    <div class="field">Objetivo: ${T.name} · ${T.owner} · ${T.id}</div>
    <div class="rows"><div><span>Escombros generados</span><span>${fmt(out.result.debris.metal)} Metal · ${fmt(out.result.debris.crystal)} Cristal</span></div></div>
    ${lootRows(out.loot)}`, null);
  setStatus(out.result.winner === 'attacker' ? 'Victoria: botín recogido y escombros generados.' : 'Derrota: la flota fue destruida en parte.', out.result.winner !== 'attacker');
  refresh();
}

// Ataque hostil al Planeta Principal: combate contra naves y defensas estacionadas
function resolveHostile(m){
  const P = state.planets[0];
  const L = P.lvl;
  const def = {};
  UNIT_KEYS.forEach(k => { if ((P.fleet[k] || 0) > 0) def[k] = P.fleet[k]; });
  const gen = state.empireClass === 'general' ? 1.15 : 1;
  const r = simulateBattle(m.fleet, {armas:0, escudos:0, blindaje:0}, def,
                           {armas:L.cp || 0, escudos:L.bl || 0, blindaje:0, lz:L.lz || 0, io:L.io || 0, pl:L.pl || 0},
                           {def:{a:gen, sh:gen}});
  if (r.winner === 'defender') state.stats.wins++;
  Object.keys(def).forEach(k => { if (r.dEnd[k] !== undefined) P.fleet[k] = r.dEnd[k]; });
  const loot = {metal:0, crystal:0, deut:0};
  if (r.winner === 'attacker'){
    let cap = cargoOf(r.aEnd);
    RES.forEach(k => {
      const take = Math.min(Math.floor(P.res[k] * 0.5), Math.max(0, Math.floor(cap)));
      loot[k] = take; cap -= take; P.res[k] -= take;
    });
  }
  const debris = r.debris;
  if (debris.metal + debris.crystal > 0) addDebris(P.coords, debris);
  // Escombros grandes pueden formar una luna en el planeta atacado
  const total = debris.metal + debris.crystal;
  if (total >= 100000){
    const chance = Math.min(20, Math.floor(total / 100000));
    if (Math.random() * 100 < chance && createMoon(0)) setStatus('¡Se ha formado una luna en tu planeta principal!');
  }
  pushInbox({kind:'battle', title:'Ataque hostil · Planeta Principal', t:state.simSec, data:null,
    html: resultHTML(r) + lootRows(loot)});
}

/* ----- Galaxia ----- */
// Planeta generado con las pérdidas y el saqueo ya registrados en la partida
function getPlanet(g, s, p){
  const base = systemPlanets(g, s)[p - 1];
  const dbr = debrisAt(base.id);
  const colony = state.galaxy.colonies && state.galaxy.colonies[base.id];
  if (colony) return {...base, occupied:true, mine:true, owner:'Tú', alli: state.alliance ? state.alliance.tag : '', name: colony.name, fleet:{}, defense:{lm:0}, res:{metal:0, crystal:0, deut:0}, debris:dbr};
  if (!base.occupied) return {...base, debris:dbr};
  const loot = state.galaxy.looted[base.id] || {};
  const dmg = (state.galaxy.dmg || {})[base.id] || {};
  const res = {};
  RES.forEach(r => { res[r] = Math.max(0, base.res[r] - (loot[r] || 0)); });
  const fleet = {}, defense = {};
  Object.keys(base.fleet).forEach(k => { fleet[k] = Math.max(0, base.fleet[k] - (dmg[k] || 0)); });
  Object.keys(base.defense).forEach(k => { defense[k] = Math.max(0, base.defense[k] - (dmg[k] || 0)); });
  return {...base, res, fleet, defense, debris:dbr};
}

function galaxyTable(g, s){
  const P = activePlanet();
  const canScan = P.moon && (P.lvl.ph || 0) >= 1;
  const rows = Array.from({length:15}, (_, i) => getPlanet(g, s, i + 1));
  return `<div style="overflow-x:auto"><table class="table">
    <thead><tr><th>Posición</th><th>Planeta</th><th>Jugador</th><th>Alianza</th><th>Escombros</th><th>Acciones</th></tr></thead>
    <tbody>${rows.map(p => {
      const debrisTxt = (p.debris.metal + p.debris.crystal) > 0 ? `${fmt(p.debris.metal)} M · ${fmt(p.debris.crystal)} C` : '<span class="muted">—</span>';
      const main = p.mine ? 'Tu colonia' : p.occupied ? `<button class="btn inline" data-spy="${p.id}">Espiar</button><button class="btn inline" data-attack="${p.id}">Atacar</button>` : `<button class="btn inline" data-colonize="${p.id}">Colonizar</button>`;
      const recy = (p.debris.metal + p.debris.crystal) > 0 ? `<button class="btn inline" data-action="fleet-prefill" data-coords="${p.id}" data-mis="recycle">Reciclar</button>` : '';
      const scan = canScan ? `<button class="btn inline" data-action="phalanx" data-coords="${p.id}">Escanear</button>` : '';
      return `
      <tr>
        <td class="mono-cell">${p.pos}</td>
        <td>${p.occupied ? p.name : '<span class="muted">Planeta Deshabitado</span>'}</td>
        <td>${p.occupied ? p.owner : '—'}</td>
        <td>${p.occupied && p.alli ? p.alli : '—'}</td>
        <td class="mono-cell">${debrisTxt}</td>
        <td><div class="inline-form">${main}${recy}${scan}</div></td>
      </tr>`;
    }).join('')}
    </tbody>
  </table></div>`;
}

function colonize(id){
  if (state.lvl.ap < 1) return setStatus('Necesitas Astrofísica nivel 1 para colonizar.', true);
  if ((state.fleet.co || 0) < 1) return setStatus('Necesitas una Nave Colonizadora en el hangar de este planeta.', true);
  state.fleet.co--;
  state.galaxy.colonies = state.galaxy.colonies || {};
  const name = 'Colonia ' + id;
  state.galaxy.colonies[id] = {name};
  const lvl = makeLvl(false);
  TECH_KEYS.forEach(k => { lvl[k] = state.lvl[k] || 0; });
  lvl.mm = 1; lvl.mc = 1; lvl.sol = 1;
  state.planets.push({name, coords:id, res:{metal:500, crystal:300, deut:0, token:0}, lvl, fleet:makeFleet(), queue:null, moon:false});
  renderPlanetSelect();
  switchPlanet(state.planets.length - 1);
  setStatus('Colonia fundada en ' + id + '. Ahora gestionas ' + name + '.');
}

/* ----- Flotas en movimiento ----- */
function fleetSummary(f){
  return Object.keys(f || {}).filter(k => (f[k] || 0) > 0).map(k => fmt(f[k]) + ' ' + SHIPS[k].name).join(' · ') || 'Sin naves';
}
function moveId(){ return 'mv' + Date.now().toString(36) + (moveSeq++); }
function addMove(m){ state.moves.push(m); renderMoves(); }
function simulateIncoming(){
  if (state.vacation) return setStatus('Modo Vacaciones activo: no hay ataques entrantes.', true);
  if (state.moves.some(m => m.owner === 'enemy')) return setStatus('Ya hay una flota hostil en camino.', true);
  const now = Date.now();
  const fleet = {nc:3 + Math.floor(Math.random() * 5), cz:10 + Math.floor(Math.random() * 16), cr:2 + Math.floor(Math.random() * 5), sp:0, co:0};
  addMove({id:moveId(), owner:'enemy', label:'Flota hostil → Planeta Principal', planet:0, startAt:now, endAt:now + 45000, fleet});
  setStatus('Alerta: flota hostil detectada. Llega en 45 s.', true);
  refresh();
}
function sendTestFleet(){
  if (state.moves.filter(m => m.owner === 'own').length >= maxFleets()) return setStatus('Límite de flotas simultáneas alcanzado (' + maxFleets() + ').', true);
  const f = {};
  let total = 0;
  MOVE_SHIPS.forEach(k => { const n = state.fleet[k] || 0; if (n > 0){ f[k] = n; total += n; state.fleet[k] = 0; } });
  if (!total) return setStatus('No hay naves en el hangar de este planeta.', true);
  const now = Date.now();
  addMove({id:moveId(), owner:'own', label:'Flota de prueba · Órbita de patrulla', planet:state.active, startAt:now, endAt:now + 60000, fleet:f});
  setStatus('Flota enviada. Regresará en 60 s o puedes retirarla antes.');
  refresh();
}
// Devuelve naves y carga al planeta de origen
function returnFleet(m){
  const P = state.planets[m.planet];
  if (!P) return;
  Object.keys(m.fleet || {}).forEach(k => { P.fleet[k] = (P.fleet[k] || 0) + (m.fleet[k] || 0); });
  if (m.cargo) RES.forEach(r => { P.res[r] = Math.min(capOf(P.lvl[CAP_KEY[r]]), (P.res[r] || 0) + (m.cargo[r] || 0)); });
}
function recallMove(id){
  const m = state.moves.find(x => x.id === id);
  if (!m || m.owner !== 'own') return;
  returnFleet(m);
  state.moves = state.moves.filter(x => x.id !== id);
  renderMoves();
  refresh();
  setStatus('Flota retirada. Naves y carga de vuelta en el planeta de origen.');
}
// Llegada de flotas: misiones de ida, regreso, hostiles y pruebas
function checkMoves(){
  const now = Date.now();
  if (state.vacation) state.moves = state.moves.filter(m => m.owner !== 'enemy');
  const done = state.moves.filter(m => m.endAt <= now);
  if (!done.length) return;
  const removed = new Set();
  done.forEach(m => {
    if (m.owner === 'enemy'){ resolveHostile(m); removed.add(m.id); return; }
    if (m.phase === 'out'){ if (processMission(m) === 'remove') removed.add(m.id); return; }
    returnFleet(m); removed.add(m.id);
  });
  state.moves = state.moves.filter(m => !removed.has(m.id));
  renderMoves();
}

// Ejecuta la misión al llegar. Devuelve 'remove' si la flota desaparece o 'keep' si vuelve.
function processMission(m){
  const now = Date.now();
  const home = () => { m.phase = 'back'; m.endAt = now + (m.back || 20) * 1000; return 'keep'; };
  if (m.mission === 'attack'){
    const T = planetById(m.target);
    if (!T.occupied || T.mine) return home();
    const out = resolveAttack(T, m.fleet);
    m.fleet = out.survivors;
    m.cargo = out.loot;
    pushInbox({kind:'battle', title:'Ataque · ' + T.name + ' (' + T.id + ')', t:state.simSec, data:null,
               html: resultHTML(out.result) + lootRows(out.loot)});
    return home();
  }
  if (m.mission === 'transport'){
    const T = state.planets[m.targetIdx];
    if (T) RES.forEach(r => { T.res[r] = Math.min(capOf(T.lvl[CAP_KEY[r]]), (T.res[r] || 0) + (m.cargo[r] || 0)); });
    m.cargo = {};
    return home();
  }
  if (m.mission === 'deploy'){
    const T = state.planets[m.targetIdx];
    if (!T) return home();
    Object.keys(m.fleet || {}).forEach(k => { T.fleet[k] = (T.fleet[k] || 0) + (m.fleet[k] || 0); });
    return 'remove';
  }
  if (m.mission === 'spy'){
    const T = planetById(m.target);
    if (T.occupied && !T.mine) pushInbox({kind:'spy', title:'Espionaje · ' + T.name + ' (' + T.id + ')', t:state.simSec, data:null, html:spyReportHTML(T)});
    m.fleet = Object.assign({}, m.fleet, {sp:Math.max(0, (m.fleet.sp || 0) - 1)});   // una sonda se consume
    m.cargo = {};
    return home();
  }
  if (m.mission === 'recycle'){
    const D = state.debris[m.target];
    const cap = (m.fleet.rc || 0) * (SHIPS.rc.cargo) * (1 + 0.05 * (state.lvl.hy || 0));
    const total = D ? D.metal + D.crystal : 0;
    const take = Math.min(total, cap);
    const got = {metal:0, crystal:0, deut:0};
    if (total > 0 && take > 0){
      got.metal = Math.floor(take * D.metal / total);
      got.crystal = Math.floor(take * D.crystal / total);
      D.metal -= got.metal; D.crystal -= got.crystal;
      if (D.metal + D.crystal <= 0) delete state.debris[m.target];
    }
    m.cargo = got;
    return home();
  }
  return home();
}

/* ----- Despacho de flotas (pestaña Flota) ----- */
function valOf(id){ const el = document.getElementById(id); return el ? el.value : ''; }
function readFleetForm(){
  const P = activePlanet();
  const sel = {};
  let total = 0;
  MOVE_SHIPS.forEach(k => {
    const inp = document.querySelector('[data-fq="' + k + '"]');
    const n = Math.min(P.fleet[k] || 0, Math.max(0, Math.floor(Number(inp && inp.value) || 0)));
    if (n > 0){ sel[k] = n; total += n; }
  });
  const cargo = {};
  RES.forEach(r => { cargo[r] = Math.min(P.res[r] || 0, Math.max(0, Math.floor(Number(valOf('f-c-' + r)) || 0))); });
  return {sel, total, g:clampInt(valOf('f-g'), 1, 9), s:clampInt(valOf('f-s'), 1, 499), p:clampInt(valOf('f-p'), 1, 15),
          mis:valOf('f-mis') || 'attack', cargo, own:Number(valOf('f-own'))};
}
// Cálculo en tiempo real: capacidad, combustible, distancia y tiempo
function fleetPlan(f){
  const P = activePlanet(), L = state.lvl;
  const sumFuel = Object.keys(f.sel).reduce((x, k) => x + f.sel[k] * (SHIPS[k].fuel || 0), 0);
  const red = Math.max(0.2, 1 - 0.05 * ((L.im || 0) + (L.hd || 0)));
  const cap = cargoOf(f.sel);
  const loadTotal = RES.reduce((x, r) => x + (f.cargo[r] || 0), 0);
  let dist = 0, target = null;
  if (f.mis === 'attack' || f.mis === 'spy' || f.mis === 'recycle'){
    dist = distanceOf(parseCoords(P.coords), [f.g, f.s, f.p]);
    target = f.g + ':' + f.s + ':' + f.p;
  } else if (state.planets[f.own]){
    dist = distanceOf(parseCoords(P.coords), parseCoords(state.planets[f.own].coords));
    target = state.planets[f.own].name;
  }
  const jump = f.mis === 'jump';
  const fuel = jump ? 0 : Math.ceil(sumFuel * red * (1 + dist / 100));
  const secs = jump ? 0 : travelSeconds(dist);
  return {cap, loadTotal, fuel, secs, dist, target};
}
function updateFleetCalc(){
  const box = document.getElementById('fleet-calc');
  if (!box) return;
  const f = readFleetForm(), pl = fleetPlan(f);
  box.innerHTML = `<div class="rows">
    <div><span>Naves seleccionadas</span><span>${fmt(f.total)}</span></div>
    <div><span>Capacidad de carga total</span><span>${fmt(pl.cap)}</span></div>
    <div><span>Carga asignada</span><span class="${pl.loadTotal > pl.cap ? 'tag-bad' : ''}">${fmt(pl.loadTotal)}</span></div>
    <div><span>Distancia · tiempo de vuelo</span><span>${fmt(pl.dist)} · ${pl.secs} s</span></div>
    <div><span>Consumo de Deuterio (combustible)</span><span class="${pl.fuel + f.cargo.deut > state.res.deut ? 'tag-bad' : ''}">${fmt(pl.fuel)} de ${fmt(state.res.deut)}</span></div>
  </div>`;
}
function launchFleet(){
  const f = readFleetForm(), P = activePlanet();
  if (f.total < 1) return setStatus('Selecciona al menos una nave en el hangar.', true);
  if (f.mis === 'jump') return jumpFleet(f);
  const pl = fleetPlan(f);
  if (pl.loadTotal > pl.cap) return setStatus('La carga supera la capacidad de la flota.', true);
  if (state.moves.filter(m => m.owner === 'own').length >= maxFleets()) return setStatus('Límite de flotas simultáneas alcanzado (' + maxFleets() + ').', true);
  const isLocal = f.mis === 'attack' || f.mis === 'spy' || f.mis === 'recycle';
  if (isLocal){
    const T = planetById(pl.target);
    if (pl.target === P.coords) return setStatus('Ese es el mismo planeta de origen.', true);
    if (f.mis === 'attack'){
      if (!T.occupied || T.mine) return setStatus('Objetivo no válido: necesitas un planeta rival.', true);
      if (!Object.keys(f.sel).some(k => SHIPS[k].a > 0)) return setStatus('La flota necesita naves con ataque.', true);
    }
    if (f.mis === 'spy'){
      if (!T.occupied || T.mine) return setStatus('Objetivo no válido para espionaje.', true);
      if (!(f.sel.sp > 0)) return setStatus('Incluye al menos una Sonda de Espionaje.', true);
    }
    if (f.mis === 'recycle'){
      if (!f.sel.rc) return setStatus('Incluye Naves Recicladoras.', true);
      const D = state.debris[pl.target];
      if (!D || D.metal + D.crystal <= 0) return setStatus('No hay escombros en esas coordenadas.', true);
    }
  } else {
    if (!state.planets[f.own] || f.own === state.active) return setStatus('Elige otro planeta o luna propia como destino.', true);
  }
  if (P.res.deut < pl.fuel + f.cargo.deut) return setStatus('Combustible insuficiente: necesitas ' + fmt(pl.fuel + f.cargo.deut) + ' de Deuterio.', true);
  // Ejecución: las naves salen del hangar, el combustible y la carga se descuentan
  Object.keys(f.sel).forEach(k => { P.fleet[k] -= f.sel[k]; });
  P.res.deut -= pl.fuel;
  RES.forEach(r => { P.res[r] -= f.cargo[r]; });
  const now = Date.now();
  const toOwn = f.mis === 'transport' || f.mis === 'deploy';
  addMove({id:moveId(), owner:'own', mission:f.mis, phase:'out', planet:state.active,
           targetIdx: toOwn ? f.own : -1, target: pl.target || state.planets[f.own].name,
           label: FLEET_MISSIONS[f.mis] + ' → ' + (pl.target || state.planets[f.own].name),
           fleet:f.sel, cargo:{...f.cargo}, back:pl.secs, startAt:now, endAt:now + pl.secs * 1000});
  setStatus(FLEET_MISSIONS[f.mis] + ' en marcha. Llegada en ' + mmss(pl.secs) + '.');
  refresh();
}
// Salto Cuántico: transferencia instantánea entre dos lunas con Salto Cuántico
function jumpFleet(f){
  const P = activePlanet(), T = state.planets[f.own];
  if (!P.moon || (P.lvl.jg || 0) < 1) return setStatus('El Salto Cuántico requiere una luna con Salto Cuántico.', true);
  if (!T || !T.moon || T === P || (T.lvl.jg || 0) < 1) return setStatus('Destino inválido: otra luna con Salto Cuántico.', true);
  Object.keys(f.sel).forEach(k => { P.fleet[k] -= f.sel[k]; T.fleet[k] = (T.fleet[k] || 0) + f.sel[k]; });
  setStatus('Salto cuántico completado: naves transferidas a ' + T.name + '.');
  refresh();
}
// Sensor Phalanx: escanea coordenadas para ver movimientos de flotas enemigas
function phalanxScan(id){
  const P = activePlanet();
  if (!P.moon || (P.lvl.ph || 0) < 1) return setStatus('Necesitas un Sensor Phalanx en una luna.', true);
  let h = 0;
  for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const r = rng(h + Math.floor(state.simSec / 900) * 7919);
  const rows = [`<div><span>Coordenadas</span><span>${id}</span></div>`];
  if (r() < 0.4){
    const who = PLAYERS[Math.floor(r() * PLAYERS.length)];
    const kinds = ['Cazadores Ligeros', 'Cruceros', 'Sondas'];
    rows.push(`<div><span>Flota de ${who}</span><span>${1 + Math.floor(r() * 30)} ${kinds[Math.floor(r() * kinds.length)]}</span></div>`);
    rows.push(`<div><span>Llegada estimada</span><span>${mmss(60 + Math.floor(r() * 900))}</span></div>`);
  } else {
    rows.push('<div><span>Movimientos enemigos</span><span class="muted">Sin flotas detectadas</span></div>');
  }
  state.moves.filter(m => m.owner === 'own' && m.target === id).forEach(m => rows.push(`<div><span>Tu flota</span><span>${esc(m.label)}</span></div>`));
  openModal('Sensor Phalanx · ' + id, `<div class="rows">${rows.join('')}</div>`, null);
}

function renderMoves(){
  const boxes = document.querySelectorAll('.moves-box');
  if (!boxes.length) return;
  const now = Date.now();
  const html = state.moves.length ? state.moves.map(m => {
    const pct = Math.min(100, Math.max(0, (now - m.startAt) / (m.endAt - m.startAt) * 100));
    const rem = Math.max(0, Math.ceil((m.endAt - now) / 1000));
    const tag = m.owner === 'enemy' ? '<span class="tag-bad">Hostil</span>' : '<span class="tag-ok">Propia</span>';
    const phase = m.phase === 'back' ? ' · Regresando' : '';
    return `

function unitOk(id){ return reqOk(unitReqs(id)); }
function buildShips(id){
  const inp = document.querySelector('[data-qty="' + id + '"]');
  const q = Math.max(1, Math.floor(Number(inp && inp.value) || 1));
  if (inp) inp.value = q;
  const S = SHIPS[id];
  if (state.lvl.sy < 1) return setStatus('Necesitas un Astillero Naval de nivel 1 o superior.', true);
  if (!unitOk(id)) return setStatus('Requisitos no cumplidos: ' + reqText(unitReqs(id)) + '.', true);
  if (id === 'mi'){
    const cap = 10 * (state.lvl.silo || 0);
    if ((state.fleet.mi || 0) + q > cap) return setStatus('Silo insuficiente: capacidad de ' + cap + ' misiles.', true);
  }
  const need = {metal:(S.cost.metal || 0) * q, crystal:(S.cost.crystal || 0) * q, deut:(S.cost.deut || 0) * q};
  if (!RES.every(r => state.res[r] >= need[r])) return setStatus('Recursos insuficientes para construir ' + q + ' × ' + S.name + '.', true);
  RES.forEach(r => { state.res[r] -= need[r]; });
  state.fleet[id] = (state.fleet[id] || 0) + q;
  state.spent += need.metal + need.crystal + need.deut;
  bumpMission('ships', q);
  setStatus('Construidas ' + q + ' × ' + S.name + '.');
  refresh();
}

function prodRow(k){
  const L = state.lvl, e = energy(), sp = state.speed, bon = 1 + allianceBonus(), f = prodFactor(k);
  if (k === 'mm')  return {e: -F.consMetal(L.mm) * f, h: F.hourlyMetal(L.mm) * e.eff * bon * f * sp};
  if (k === 'mc')  return {e: -F.consCrystal(L.mc) * f, h: F.hourlyCrystal(L.mc) * e.eff * bon * f * sp};
  if (k === 'ds')  return {e: -F.consDeut(L.ds) * f, h: F.hourlyDeut(L.ds) * (1 + 0.05 * L.cm) * e.eff * bon * f * sp};
  if (k === 'sol') return {e: F.solar(L.sol) * (1 + 0.05 * L.en) * (1 + (officerOn('eng') ? 0.20 : 0)) * f, h: 0};
  return {e: F.fusE(L.fus || 0) * f, h: -F.fusD(L.fus || 0) * sp};
}
