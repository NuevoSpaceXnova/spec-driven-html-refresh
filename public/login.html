<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XnovaEvolution · Entrar</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0d14;color:#e8eaf2;font-family:system-ui,sans-serif}
  form{width:min(340px,90vw);display:flex;flex-direction:column;gap:12px;background:#151927;padding:24px;border-radius:10px;border:1px solid #2a3044}
  h1{font-size:20px;margin:0 0 4px}
  label{font-size:13px;color:#aab1c8;display:flex;flex-direction:column;gap:4px}
  input{padding:10px;border-radius:6px;border:1px solid #2a3044;background:#0b0d14;color:#e8eaf2;font-size:15px}
  button{padding:10px;border:0;border-radius:6px;background:#7c5cff;color:#fff;font-size:15px;cursor:pointer}
  button.link{background:none;color:#aab1c8;text-decoration:underline;padding:4px}
  .err{color:#ff7a7a;font-size:13px;min-height:16px}
</style>
</head>
<body>
<form id="f" novalidate>
  <h1 id="title">Entrar</h1>
  <label>Correo<input type="email" name="email" autocomplete="email" required></label>
  <label>Contraseña<input type="password" name="password" autocomplete="current-password" required minlength="8"></label>
  <div class="err" id="err"></div>
  <button type="submit" id="go">Entrar</button>
  <button type="button" class="link" id="switch">Crear cuenta</button>
</form>
<script>
(function () {
  var mode = 'login';
  var f = document.getElementById('f');
  var err = document.getElementById('err');
  var title = document.getElementById('title');
  var go = document.getElementById('go');
  var sw = document.getElementById('switch');
  var pw = f.password;
  function setMode(m) {
    mode = m;
    title.textContent = m === 'login' ? 'Entrar' : 'Crear cuenta';
    go.textContent = m === 'login' ? 'Entrar' : 'Registrarme';
    sw.textContent = m === 'login' ? 'Crear cuenta' : 'Ya tengo cuenta';
    pw.setAttribute('autocomplete', m === 'login' ? 'current-password' : 'new-password');
    err.textContent = '';
  }
  sw.addEventListener('click', function () { setMode(mode === 'login' ? 'register' : 'login'); });
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    err.textContent = '';
    go.disabled = true;
    fetch('/api/' + (mode === 'login' ? 'login' : 'register'), {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: f.email.value, password: pw.value })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) { return { ok: r.ok, data: data }; });
    }).then(function (res) {
      if (res.ok) { window.location.href = '/'; return; }
      err.textContent = res.data.error || 'No se pudo completar';
    }).catch(function () {
      err.textContent = 'Sin conexión con el servidor';
    }).then(function () { go.disabled = false; });
  });
})();
</script>
</body>
</html>
