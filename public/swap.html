<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XnovaEvolution · Swap y Staking</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Swap y Staking · mismo lenguaje visual que XnovaEvolution */
:root{
  --bg-app:#0B0D10; --bg-panel:#0E1220; --bg-surface:#151C2B; --bg-dark:#06080C;
  --border-subtle:#1E2A44; --border-active:#2F63D1;
  --text-primary:#FFFFFF; --text-secondary:#D4DCED; --text-muted:#A8B5D1;
  --accent-primary:#2450C5; --accent-hover:#3266E0; --accent-text:#8FB4FF;
  --up:#1CFF8A; --down:#FF3D5A; --gold:#F5C451;
  --font-sans:'Rajdhani',sans-serif; --font-title:'Orbitron',sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:4px;
}
[hidden]{display:none!important}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--border-subtle) transparent}
html,body{margin:0;min-height:100%}
body{
  background:linear-gradient(rgba(11,13,16,.6),rgba(11,13,16,.7)),url('assets/space-bg.jpg') center/cover no-repeat fixed,var(--bg-app);
  color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.4
}
button,input,select{font-family:inherit}

/* Cabecera */
.top{position:sticky;top:0;z-index:20;min-height:56px;display:flex;align-items:center;gap:18px;padding:8px 20px;background:var(--bg-panel);border-bottom:1px solid var(--border-subtle);flex-wrap:wrap}
.top a.back{color:var(--accent-text);text-decoration:none;font:600 12px var(--font-title);letter-spacing:.08em}
.top a.back:hover{color:var(--text-primary)}
.top h1{margin:0;font:600 15px var(--font-title);letter-spacing:.1em}
.tag{font:500 10px var(--font-mono);color:var(--text-muted);border:1px solid var(--border-subtle);border-radius:2px;padding:2px 6px;text-transform:uppercase;letter-spacing:.1em}
.bal{margin-left:auto;display:flex;gap:14px;font:500 12px var(--font-mono);color:var(--text-secondary);flex-wrap:wrap}
.bal b{color:var(--text-primary);font-weight:600}

/* Botón de billetera y menú */
.wwrap{position:relative;flex:none}
.wbtn-top{height:36px;padding:0 14px;background:linear-gradient(180deg,#2450C5,#1B3A99);border:1px solid var(--accent-primary);border-radius:var(--r);color:#fff;font:600 12px var(--font-title);letter-spacing:.06em;cursor:pointer;white-space:nowrap}
.wbtn-top:hover{background:var(--accent-hover)}
.wbtn-top.on{background:var(--bg-surface);border-color:var(--up);color:var(--up)}
.wmenu{position:absolute;right:0;top:44px;width:320px;background:var(--bg-dark);border:1px solid var(--border-subtle);border-top:2px solid var(--accent-primary);border-radius:var(--r);padding:12px;box-shadow:0 20px 40px rgba(0,0,0,.6);z-index:30}
.wlist{display:flex;flex-direction:column;gap:6px}
.wopt{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:var(--bg-app);border:1px solid var(--border-subtle);border-radius:var(--r);padding:8px 10px;color:var(--text-primary);cursor:pointer;font:600 13px var(--font-sans)}
.wopt:hover:not(:disabled){border-color:var(--border-active)}
.wopt small{font:500 10px var(--font-mono);color:var(--text-muted)}
.wconn{font:500 12px var(--font-mono);color:var(--text-secondary);word-break:break-all;margin-bottom:8px}
.wconn b{color:var(--up);font-weight:600}
.wnote{font:500 10px var(--font-mono);color:var(--text-muted);margin:10px 0 0;line-height:1.5}

/* Pestañas */
.tabs{display:flex;gap:6px;padding:12px 20px 0;max-width:1440px;margin:0 auto}
.tab{background:var(--bg-surface);border:1px solid var(--border-subtle);color:var(--text-muted);border-radius:var(--r);height:36px;padding:0 18px;font:600 12px var(--font-title);letter-spacing:.08em;cursor:pointer;text-transform:uppercase}
.tab:hover{color:var(--text-primary)}
.tab.active{color:var(--text-primary);border-color:var(--border-active);background:linear-gradient(180deg,#1E3F9E,#2450C5)}

/* Paneles con el mismo fondo de las tarjetas del juego */
.panel{background:linear-gradient(rgba(6,8,12,.5),rgba(6,8,12,.6)),url('assets/header-bg.png') center/cover no-repeat,var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--r);padding:14px;min-width:0}
.panel h3{margin:0 0 10px;font:600 11px var(--font-title);letter-spacing:.14em;text-transform:uppercase;color:var(--text-secondary)}

/* Vista Swap */
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:14px;padding:14px;max-width:1440px;margin:0 auto}
.pairs{grid-column:1;grid-row:1 / span 2;align-self:start;max-height:calc(100vh - 150px);overflow:auto;background:var(--bg-dark)}
.chart{grid-column:2;grid-row:1}
.hist{grid-column:2;grid-row:2}
.side{grid-column:3;grid-row:1 / span 2;align-self:start}

/* Mercados */
.pair{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:transparent;border:1px solid transparent;border-radius:var(--r);padding:7px 9px;color:var(--text-primary);cursor:pointer;text-align:left}
.pair:hover{background:rgba(36,80,197,.18)}
.pair.active{background:var(--bg-surface);border-color:var(--border-active)}
.pair .nm{font:600 14px var(--font-sans);letter-spacing:.04em}
.pair .sub{font:500 10px var(--font-mono);color:var(--text-muted)}
.pair .px{font:500 12px var(--font-mono);text-align:right;color:var(--text-primary)}
.pair .chg{font:500 11px var(--font-mono);text-align:right}
.up{color:var(--up)} .down{color:var(--down)}

/* Gráfica */
.chart-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.chart-head .nm{font:600 16px var(--font-title);letter-spacing:.06em}
.chart-head .px{font:600 18px var(--font-mono)}
.chart-head .chg{font:500 12px var(--font-mono)}
.tfs{margin-left:auto;display:flex;gap:4px}
.tf,.tool{background:var(--bg-surface);border:1px solid var(--border-subtle);color:var(--text-muted);border-radius:var(--r);height:28px;padding:0 10px;font:500 12px var(--font-mono);cursor:pointer}
.tf:hover,.tool:hover{color:var(--text-primary)}
.tf.active,.tool.active{color:var(--text-primary);border-color:var(--border-active);background:linear-gradient(180deg,#1E3F9E,#2450C5)}
.tools{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tools .sep{width:1px;background:var(--border-subtle);margin:0 4px}
.ohlc{font:500 11px var(--font-mono);color:var(--text-muted);margin-bottom:6px;min-height:16px;display:flex;gap:12px;flex-wrap:wrap}
.ohlc b{color:var(--text-primary);font-weight:500}
#cv{display:block;width:100%;height:380px;border:1px solid var(--border-subtle);border-radius:var(--r);background:var(--bg-dark);touch-action:none}
#cv.tool-on{cursor:crosshair}
#cv.tool-cursor{cursor:grab}
.chart:fullscreen{background:var(--bg-app);border:0;border-radius:0;overflow:auto;padding:14px}
.chart:fullscreen #cv{height:calc(100vh - 190px)}
.foot{margin-top:8px;font:500 10px var(--font-mono);color:var(--text-muted);letter-spacing:.04em;line-height:1.5}

/* Vista Staking */
.stwrap{padding:14px;max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.st-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st-stat{padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg-dark)}
.st-stat small{font:600 10px var(--font-sans);text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted)}
.st-stat b{font:600 15px var(--font-title);color:var(--text-primary)}
.subtabs{display:flex;gap:6px}
.tab.sm{height:30px;padding:0 12px;font-size:11px}
.st-split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
.pool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pool-card{font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-start;gap:3px;padding:12px;margin:0;align-self:stretch;min-height:96px;border:1px solid var(--border-subtle);border-radius:var(--r);background:var(--bg-dark)}
.pool-card:hover{border-color:var(--border-active)}
.pool-card.sel{border-color:var(--border-active);box-shadow:0 0 0 1px var(--accent-glow)}
.pc-name{font:600 12px var(--font-title);letter-spacing:.04em}
.pc-apy{font:600 20px var(--font-title);color:var(--accent-text)}
.pc-apy small{font:500 11px var(--font-mono);color:var(--text-muted)}
.pc-meta{font:500 11px var(--font-mono);color:var(--text-muted)}
.calc{display:flex;flex-direction:column;gap:10px}
.calc .field{padding:8px 10px}
.calc .row{gap:6px}
.chips{display:flex;gap:4px}
.chip{height:24px;padding:0 8px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--r);color:var(--text-muted);font:500 11px var(--font-mono);cursor:pointer}
.chip:hover{color:var(--text-primary);border-color:var(--border-active)}
.kv{margin:0;display:flex;flex-direction:column;gap:4px;font:500 12px var(--font-mono)}
.kv div{display:flex;justify-content:space-between;gap:8px;color:var(--text-muted)}
.kv b{color:var(--text-primary);font-weight:500;text-align:right}
.btn.compact{width:auto;height:32px;padding:0 16px;font-size:11px;align-self:flex-start}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.pos-card{display:flex;flex-direction:column;gap:8px;padding:12px}
.pc-top{display:flex;justify-content:space-between;align-items:center;font:600 12px var(--font-title);letter-spacing:.04em}
.bar{height:6px;background:var(--bar-track);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar-fill)}
.pc-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font:500 11px var(--font-mono);color:var(--text-muted)}
.pc-row b{color:var(--text-primary);font-weight:500}
.pc-btns{display:flex;gap:6px}
.minichart{background:var(--bg-dark);border:1px solid var(--border-subtle);border-radius:var(--r);padding:8px}
.mc-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font:500 11px var(--font-mono);margin-bottom:4px}
.mc-head .nm{font:600 12px var(--font-title);letter-spacing:.04em}
#mcCv{display:block;width:100%;height:110px}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--bg-dark);border:1px solid var(--border-subtle);border-left:3px solid var(--up);padding:8px 12px;border-radius:var(--r);font:500 12px var(--font-mono);color:var(--text-primary);box-shadow:0 8px 20px rgba(0,0,0,.5);max-width:300px}
.toast.bad{border-left-color:var(--down)}
@media (max-width:900px){
  .st-split{grid-template-columns:minmax(0,1fr)}
}

/* Tablas */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 10px var(--font-sans);text-transform:uppercase;letter-spacing:.12em;color:var(--text-secondary);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border-subtle);background:var(--bg-surface)}
td{padding:9px 10px;border-bottom:1px solid var(--border-subtle)}
.mono{font-family:var(--font-mono);font-size:12px}
.r{text-align:right}
.empty{color:var(--text-muted);padding:12px 10px}

/* Formularios */
.field{background:var(--bg-app);border:1px solid var(--border-subtle);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.field label{font:600 10px var(--font-sans);text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted)}
.field .row{display:flex;gap:8px;align-items:center}
.field small{font:500 11px var(--font-mono);color:var(--text-muted)}
.sel,.amt{height:38px;background:var(--bg-surface);color:var(--text-primary);border:1px solid var(--border-subtle);border-radius:var(--r);padding:0 10px;font:500 13px var(--font-mono)}
.sel{min-width:130px}
.amt{flex:1;min-width:0;text-align:right}
.amt[readonly]{color:var(--accent-text)}
.sel:focus-visible,.amt:focus-visible{outline:none;border-color:var(--accent-primary)}
.flip{display:block;margin:6px auto;width:36px;height:30px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--r);color:var(--accent-text);cursor:pointer;font-size:16px}
.flip:hover{border-color:var(--border-active)}
.rates{margin:10px 0;display:flex;flex-direction:column;gap:4px;font:500 11px var(--font-mono);color:var(--text-muted)}
.rates b{color:var(--text-primary);font-weight:500}
.btn{width:100%;height:42px;background:linear-gradient(180deg,#2450C5,#1B3A99);border:1px solid var(--accent-primary);color:#fff;border-radius:var(--r);font:600 13px var(--font-title);letter-spacing:.08em;cursor:pointer;text-transform:uppercase}
.btn:hover:not(:disabled){background:var(--accent-hover)}
.btn:disabled{background:var(--bg-surface);border-color:var(--border-subtle);color:var(--text-muted);cursor:not-allowed}
.btn.small{height:30px;font-size:11px;width:auto;padding:0 12px}
.btn.ghost{background:var(--bg-surface);border-color:var(--border-subtle)}
.msg{min-height:18px;margin:10px 0 0;font:500 12px var(--font-mono);color:var(--text-secondary)}
.msg.bad{color:var(--down)}
.msg.ok{color:var(--up)}
.srow{border:1px solid var(--border-subtle);border-radius:var(--r);padding:10px;margin-top:8px;background:var(--bg-app);font:500 12px var(--font-mono);display:flex;flex-direction:column;gap:6px}

@media (max-width:1100px){
  .wrap{grid-template-columns:minmax(0,1fr) 320px}
  .pairs{grid-column:1 / -1;grid-row:auto;max-height:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px}
  .pairs h3{grid-column:1 / -1}
  .chart{grid-column:1;grid-row:auto}
  .side{grid-column:2;grid-row:auto}
  .hist{grid-column:1 / -1;grid-row:auto}
  .stwrap{grid-template-columns:minmax(0,1fr)}
  .pools-panel,.form-panel,.pos-panel{grid-column:1;grid-row:auto}
}
@media (max-width:720px){
  .wrap{grid-template-columns:minmax(0,1fr);padding:10px}
  .chart,.side,.hist{grid-column:1}
  .side{order:-1}
  #cv{height:300px}
  .bal{margin-left:0;width:100%}
  .tfs{margin-left:0}
  .wmenu{width:min(320px,90vw)}
}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="forja-astral.html">◂ XNOVAEVOLUTION</a>
  <h1>SWAP</h1>
  <span class="tag">Datos ficticios · demo</span>
  <div class="bal" id="bal"></div>
  <div class="wwrap" id="wwrap">
    <button class="wbtn-top" id="walletBtn" type="button" aria-haspopup="true" aria-expanded="false">Conectar wallet</button>
    <div class="wmenu" id="walletMenu" hidden></div>
  </div>
</header>

<nav class="tabs" aria-label="Secciones">
  <button class="tab active" data-view="swap" type="button">Swap</button>
  <button class="tab" data-view="stake" type="button">Staking</button>
</nav>

<!-- ============ VISTA SWAP ============ -->
<div class="wrap" id="view-swap">
  <aside class="panel pairs">
    <h3>Mercados · BNB Chain</h3>
    <div id="pairList"></div>
  </aside>

  <section class="panel chart" id="chartPanel">
    <div class="chart-head">
      <span class="nm" id="pName"></span>
      <span class="px" id="pPrice"></span>
      <span class="chg" id="pChg"></span>
      <div class="tfs" id="tfs"></div>
    </div>
    <div class="tools" id="tools">
      <button class="tool active" data-tool="cursor" type="button" title="Mover y desplazar (arrastra la gráfica)">Cursor</button>
      <button class="tool" data-tool="trend" type="button" title="Línea de tendencia: arrastra entre dos puntos">Tendencia</button>
      <button class="tool" data-tool="hline" type="button" title="Línea horizontal: clic en el precio">Horizontal</button>
      <button class="tool" data-tool="fib" type="button" title="Fibonacci: arrastra del mínimo al máximo">Fibonacci</button>
      <button class="tool" data-tool="rect" type="button" title="Rectángulo: arrastra entre dos puntos">Rectángulo</button>
      <button class="tool" data-act="clear" type="button" title="Borrar dibujos de este mercado">Borrar</button>
      <span class="sep"></span>
      <button class="tool" data-act="zoomin" type="button" title="Acercar (también con la rueda)">Zoom +</button>
      <button class="tool" data-act="zoomout" type="button" title="Alejar (también con la rueda)">Zoom −</button>
      <button class="tool" data-act="reset" type="button" title="Restablecer zoom y posición">Ajustar</button>
      <span class="sep"></span>
      <button class="tool" data-act="full" type="button" title="Pantalla completa">Pantalla completa</button>
    </div>
    <div class="ohlc" id="ohlc"></div>
    <canvas id="cv"></canvas>
    <div class="foot">Precios generados en el navegador para la demo. Los dibujos se guardan solo mientras la página está abierta. Esc cancela un dibujo en curso.</div>
  </section>

  <div class="side">
    <section class="panel">
      <h3>Intercambio</h3>
      <div class="field">
        <label for="fromA">Desde</label>
        <div class="row">
          <select class="sel" id="fromA"></select>
          <input class="amt" id="fromAmt" type="number" min="0" step="any" placeholder="0">
        </div>
        <small id="fromBal"></small>
      </div>
      <button class="flip" id="flip" type="button" aria-label="Invertir par">⇅</button>
      <div class="field">
        <label for="toA">Hacia</label>
        <div class="row">
          <select class="sel" id="toA"></select>
          <input class="amt" id="toAmt" type="text" readonly value="">
        </div>
        <small id="toBal"></small>
      </div>
      <div class="rates" id="rates"></div>
      <button class="btn" id="doSwap" type="button">Intercambiar</button>
      <p class="msg" id="msg"></p>
    </section>
  </div>

  <section class="panel hist">
    <h3>Operaciones de swap</h3>
    <div id="histWrap"></div>
  </section>
</div>

<!-- ============ VISTA STAKING ============ -->
<div class="stwrap" id="view-stake" hidden>
  <div class="st-sum" id="stSum"></div>

  <nav class="subtabs" aria-label="Secciones de staking">
    <button class="tab sm active" data-sub="pools" type="button">Pools</button>
    <button class="tab sm" data-sub="pos" type="button">Mis posiciones</button>
    <button class="tab sm" data-sub="hist" type="button">Historial</button>
  </nav>

  <p class="msg" id="stMsg"></p>

  <section data-sub-panel="pools">
    <div class="st-split">
      <div class="pool-grid" id="poolGrid"></div>
      <aside class="panel calc">
        <h3>Bloquear TOKEN</h3>
        <div class="field">
          <label for="stPool">Pool</label>
          <div class="row"><select class="sel" id="stPool" style="min-width:0;flex:1"></select></div>
        </div>
        <div class="field">
          <label for="stAmt">Cantidad</label>
          <div class="row"><input class="amt" id="stAmt" type="number" min="0" step="1" placeholder="0"></div>
          <div class="chips">
            <button class="chip" data-pct="25" type="button">25 %</button>
            <button class="chip" data-pct="50" type="button">50 %</button>
            <button class="chip" data-pct="100" type="button">Máx</button>
          </div>
          <small id="stBal"></small>
        </div>
        <div class="minichart">
          <div class="mc-head"><span class="nm" id="mcName"></span><span id="mcPrice"></span><span id="mcChg"></span></div>
          <canvas id="mcCv"></canvas>
        </div>
        <dl class="kv" id="stQuote"></dl>
        <button class="btn compact" id="doStake" type="button">Bloquear</button>
      </aside>
    </div>
  </section>

  <section data-sub-panel="pos" hidden>
    <div class="pos-grid" id="stakeList"></div>
  </section>

  <section data-sub-panel="hist" hidden>
    <div class="panel" id="stHist"></div>
  </section>
</div>

<script>
/* ==========================================================================
   CONFIGURACIÓN PARA LA INTEGRACIÓN OFICIAL
   - contract: dirección del token/cripto en BNB Smart Chain. Quedan en null
     hasta verificarlas en una fuente oficial. No se inventan aquí.
   ========================================================================== */
const CHAIN = {
  name:'BNB Smart Chain', chainId:56, hex:'0x38',
  rpc:['https://bsc-dataseed.binance.org/'],
  explorer:'https://bscscan.com', currency:{name:'BNB', symbol:'BNB', decimals:18}
};
const TOKEN = {sym:'TOKEN', name:'Token XnovaEvolution', contract:null, decimals:18, inGame:true, start:0.80, vol:0.0015};
const CRYPTOS = [
  {sym:'USDT',  name:'Tether USD',    start:1,      vol:0.00002, stable:true, contract:null},

/* ============ DATOS FICTICIOS (reemplazar por API real) ============ */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for (let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function gauss(r){ let u=0; while(u===0) u=r(); const v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const T0 = Math.floor(Date.now()/1000) - N_MIN*60;
const paths = {};
function genPath(a){
  const r = mulberry32(hashStr(a.sym));
  const out = new Array(N_MIN);
  let cur = a.start;
  for (let i=0;i<N_MIN;i++){
    const o = cur;
    const c = Math.max(o*(1+gauss(r)*a.vol), 1e-8);
    const wick = Math.abs(gauss(r))*a.vol*0.5;
    out[i] = {t:T0+i*60, o, h:Math.max(o,c)*(1+wick), l:Math.max(Math.min(o,c)*(1-wick),1e-8), c, v:100+r()*900};
    cur = c;
  }
  return out;
}
ALL.forEach(a => { paths[a.sym] = genPath(a); });

function candles(sym, tf){
  const size = TF[tf].size, path = paths[sym], out = [];
  for (let i=0;i<path.length;i+=size){
    const end = Math.min(i+size, path.length);
    let h=-Infinity, l=Infinity, v=0;
    for (let j=i;j<end;j++){ if(path[j].h>h) h=path[j].h; if(path[j].l<l) l=path[j].l; v+=path[j].v; }
    out.push({t:path[i].t, o:path[i].o, h, l, c:path[end-1].c, v});
  }
  return out;
}
// Precio en USDT de cualquier activo
function usdt(sym){ if (sym==='USDT') return 1; const p = paths[sym]; return p[p.length-1].c; }
function changeFor(sym){
  if (sym==='USDT') return 0;
  const p = paths[sym]; const now = p[p.length-1].c, prev = p[Math.max(0,p.length-1440)].o;
  return (now-prev)/prev;
}

function fmtPrice(v){ return v>=100 ? v.toLocaleString('es-ES',{maximumFractionDigits:2,minimumFractionDigits:2}) : v>=1 ? v.toFixed(3) : v.toFixed(v<0.01?6:4); }
function fmtAmt(n){
  const x = Number(n)||0, a = Math.abs(x);
  if (a===0) return '0';
  if (a>=1000) return x.toLocaleString('es-ES',{maximumFractionDigits:2});
  if (a>=1) return x.toLocaleString('es-ES',{maximumFractionDigits:4});
  return x.toFixed(6);
}
function fmtClock(t){
  const s = Math.floor(t||0), day = Math.floor(s/86400)+1, hh = Math.floor((s%86400)/3600), mm = Math.floor((s%3600)/60);
  return 'Día ' + day + ' · ' + String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
}
function fmtTime(t, frame){
  const d = new Date(t*1000);
  return frame==='1d' ? d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'}) : d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
}

/* ============ BILLETERAS ============
   EVM (MetaMask y otras extensiones): EIP-6963. Ronin: window.ronin. Solana: Solflare y Phantom.
   Aquí solo se conecta y se cambia la red. Las transacciones on-chain quedan pendientes. */
const evmProviders = new Map();
window.addEventListener('eip6963:announceProvider', e => { evmProviders.set(e.detail.info.uuid, e.detail); renderWallet(); });
window.dispatchEvent(new Event('eip6963:requestProvider'));

let wallet = null;     // {kind:'evm'|'sol', name, address, provider}

function detectWallets(){
  const list = [];
  evmProviders.forEach(d => list.push({id:'evm:'+d.info.uuid, kind:'evm', name:d.info.name, provider:d.provider, note:'EVM · BNB Chain'}));
  if (!evmProviders.size && window.ethereum) list.push({id:'evm:injected', kind:'evm', name:'Wallet inyectada', provider:window.ethereum, note:'EVM · BNB Chain'});
  if (window.ronin && window.ronin.provider) list.push({id:'evm:ronin', kind:'evm', name:'Ronin Wallet', provider:window.ronin.provider, note:'Red Ronin (no BNB)'});
  if (window.solflare && window.solflare.isSolflare) list.push({id:'sol:solflare', kind:'sol', name:'Solflare', provider:window.solflare, note:'Solana (no BNB)'});
  if (window.phantom && window.phantom.solana) list.push({id:'sol:phantom', kind:'sol', name:'Phantom', provider:window.phantom.solana, note:'Solana (no BNB)'});
  return list;
}
async function ensureBsc(p){
  const cur = await p.request({method:'eth_chainId'});
  if (cur === CHAIN.hex) return true;
  try { await p.request({method:'wallet_switchEthereumChain', params:[{chainId:CHAIN.hex}]}); return true; }
  catch (err){
    if (err && err.code === 4902){
      await p.request({method:'wallet_addEthereumChain', params:[{chainId:CHAIN.hex, chainName:CHAIN.name, nativeCurrency:CHAIN.currency, rpcUrls:CHAIN.rpc, blockExplorerUrls:[CHAIN.explorer]}]});
      return true;
    }
    throw err;
  }
}
async function connectWallet(id){
  const w = detectWallets().find(x => x.id === id);
  if (!w) return setMsg('Esa billetera ya no está disponible. Revisa que la extensión esté activa.', 'bad');
  try {
    if (w.kind === 'evm'){
      const acc = await w.provider.request({method:'eth_requestAccounts'});
      if (!acc || !acc[0]) throw new Error('Sin cuenta');
      if (w.id !== 'evm:ronin') await ensureBsc(w.provider);
      wallet = {kind:'evm', name:w.name, address:acc[0], provider:w.provider};
    } else {
      const res = await w.provider.connect();
      wallet = {kind:'sol', name:w.name, address:res.publicKey.toString(), provider:w.provider};
    }
    setMsg('Conectado con ' + wallet.name + '.', 'ok');
    document.getElementById('walletMenu').hidden = true;
  } catch (err){
    setMsg('No se pudo conectar: ' + ((err && err.message) || 'cancelado'), 'bad');
  }
  renderWallet();
}
function disconnectWallet(){ wallet = null; setMsg('Billetera desconectada.'); renderWallet(); }

function renderWallet(){
  const btn = document.getElementById('walletBtn');
  const menu = document.getElementById('walletMenu');
  btn.textContent = wallet ? (wallet.name + ' · ' + short(wallet.address)) : 'Conectar wallet';
  btn.classList.toggle('on', !!wallet);
  btn.setAttribute('aria-expanded', String(!menu.hidden));
  if (wallet){
    menu.innerHTML = `<div class="wconn">Conectado · ${wallet.name}<br><b>${wallet.address}</b></div>
      <button class="btn small ghost" id="wDisc" type="button">Desconectar</button>`;
    document.getElementById('wDisc').onclick = disconnectWallet;
    return;
  }
  const list = detectWallets();
  const body = list.length
    ? `<div class="wlist">${list.map(w => `<button class="wopt" type="button" data-wallet="${w.id}"><span>${w.name}</span><small>${w.note}</small></button>`).join('')}</div>`
    : '<p class="empty" style="padding:0">No se detectó ninguna billetera. Instala MetaMask, Solflare, Phantom o Ronin Wallet y recarga la página.</p>';
  menu.innerHTML = body + '<p class="wnote">Conexión preparada. Las transacciones on-chain del token se activarán con la integración oficial.</p>';
}

/* ============ GRÁFICA ============ */
const FIB_LEVELS = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
function timeToX(t){ const d = scale.data; const i = (t - d[0].t) / (TF[tf].sec); return scale.padL + (i + 0.5) * scale.step; }
function priceToY(v){ return scale.padT + (scale.hi - v) / (scale.hi - scale.lo) * scale.ph; }
function pointFromXY(x, y){
  const i = (x - scale.padL) / scale.step - 0.5;
  const t = scale.data[0].t + i * TF[tf].sec;
  const p = scale.hi - (y - scale.padT) / scale.ph * (scale.hi - scale.lo);
  return {t, p: Math.max(p, 1e-8)};
}
function drawDrawing(ctx, d){
  const W = scale.W, padL = scale.padL, padR = scale.padR;
  if (d.type === 'hline'){
    const y = Math.round(priceToY(d.p1.p)) + 0.5;
    ctx.strokeStyle = '#8FB4FF'; ctx.lineWidth = 1; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W-padR, y); ctx.stroke();
    ctx.fillStyle = '#8FB4FF'; ctx.fillText(fmtPrice(d.p1.p), padL+6, y-4);
    return;
  }
  if (!d.p2) return;
  const x1 = timeToX(d.p1.t), y1 = priceToY(d.p1.p), x2 = timeToX(d.p2.t), y2 = priceToY(d.p2.p);
  if (d.type === 'trend'){
    ctx.strokeStyle = '#8FB4FF'; ctx.lineWidth = 1.5; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = '#8FB4FF';
    [[x1,y1],[x2,y2]].forEach(([x,y]) => { ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill(); });
    return;
  }
  if (d.type === 'rect'){
    ctx.strokeStyle = '#8FB4FF'; ctx.lineWidth = 1; ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(36,80,197,.18)';
    ctx.fillRect(x1, y1, x2-x1, y2-y1); ctx.strokeRect(x1, y1, x2-x1, y2-y1);
    return;
  }
  if (d.type === 'fib'){
    const left = Math.min(x1, x2), right = W - padR;
    ctx.lineWidth = 1; ctx.font = '11px "IBM Plex Mono", monospace';
    FIB_LEVELS.forEach(lv => {
      const price = d.p2.p - (d.p2.p - d.p1.p) * lv;
      const y = Math.round(priceToY(price)) + 0.5;
      ctx.strokeStyle = lv===0.5 || lv===0.618 ? '#F5C451' : 'rgba(245,196,81,.6)';
      ctx.setLineDash(lv===0 || lv===1 ? [] : [4,3]);
      ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
      ctx.fillStyle = '#F5C451';
      ctx.fillText(lv.toFixed(3) + ' · ' + fmtPrice(price), left+6, y-4);
    });
    ctx.setLineDash([]);
  }
}

function drawChart(){
  const cv = document.getElementById('cv');
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const {data} = visible(); if (!data.length) return;

  const padL=10, padR=76, padT=12, padB=24;
  const pw = W-padL-padR, ph = H-padT-padB;
  let lo=Infinity, hi=-Infinity;
  data.forEach(c => { if(c.l<lo) lo=c.l; if(c.h>hi) hi=c.h; });
  const m = (hi-lo)*0.06 || hi*0.01;
  lo -= m; hi += m;
  const step = pw/data.length;
  scale = {W, H, padL, padR, padT, ph, pw, step, lo, hi, data};
  const Y = priceToY;

  ctx.font = '11px "IBM Plex Mono", monospace';
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(30,42,68,.95)';
  ctx.fillStyle = '#A8B5D1';
  for (let i=0;i<=4;i++){
    const v = hi-(hi-lo)*i/4, y = Math.round(Y(v))+0.5;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText(fmtPrice(v), W-padR+8, y+4);
  }

  // Velas: colores sólidos y mechas visibles
  const bw = Math.max(3, step*0.66);
  data.forEach((c,i) => {
    const x = padL+(i+0.5)*step, up = c.c>=c.o, col = up ? '#1CFF8A' : '#FF3D5A';
    const xr = Math.round(x)+0.5;
    ctx.strokeStyle = col; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(xr, Y(c.h)); ctx.lineTo(xr, Y(c.l)); ctx.stroke();
    const yo = Y(c.o), yc = Y(c.c), top = Math.min(yo,yc), hgt = Math.max(1.5, Math.abs(yc-yo));
    ctx.fillStyle = col;
    ctx.fillRect(x-bw/2, top, bw, hgt);
  });
  ctx.lineWidth = 1;
  const every = Math.max(1, Math.floor(data.length/6));
  ctx.fillStyle = '#A8B5D1';
  data.forEach((c,i) => { if (i%every===0) ctx.fillText(fmtTime(c.t, tf), padL+(i+0.5)*step-18, H-7); });

  // Dibujos (recortados al área de la gráfica)
  ctx.save();
  ctx.beginPath(); ctx.rect(padL, padT, pw, ph); ctx.clip();
  drawList().forEach(d => drawDrawing(ctx, d));
  if (pending) drawDrawing(ctx, pending);
  ctx.restore();

  // Último precio
  const last = data[data.length-1], yl = Math.round(Y(last.c))+0.5;
  const lc = last.c>=last.o ? '#1CFF8A' : '#FF3D5A';
  ctx.setLineDash([4,4]); ctx.strokeStyle = lc; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL,yl); ctx.lineTo(W-padR,yl); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = lc; ctx.fillRect(W-padR+2, yl-9, padR-4, 18);
  ctx.fillStyle = '#06080C'; ctx.fillText(fmtPrice(last.c), W-padR+6, yl+4);

  // Cursor
  if (hover!=null && hover<data.length && tool==='cursor'){
    const x = Math.round(padL+(hover+0.5)*step)+0.5;
    ctx.strokeStyle = 'rgba(143,180,255,.6)'; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,H-padB); ctx.stroke();
    ctx.setLineDash([]);
  }
}

  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  let lo = Math.min(...s.map(x=>x.p)), hi = Math.max(...s.map(x=>x.p));
  const m = (hi-lo)*0.1 || hi*0.01; lo -= m; hi += m;
  const X = i => (i/(s.length-1))*(W-8)+4;
  const Yv = v => 6 + (hi-v)/(hi-lo)*(H-12);
  const col = ch>=0 ? '#1CFF8A' : '#FF3D5A';
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, ch>=0 ? 'rgba(28,255,138,.35)' : 'rgba(255,61,90,.35)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath(); ctx.moveTo(X(0), H);
  s.forEach((x,i) => ctx.lineTo(X(i), Yv(x.p)));
  ctx.lineTo(X(s.length-1), H); ctx.closePath(); ctx.fillStyle = grad; ctx.fill();
  ctx.beginPath(); s.forEach((x,i) => i ? ctx.lineTo(X(i), Yv(x.p)) : ctx.moveTo(X(i), Yv(x.p)));
  ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.stroke();
}

/* ============ STAKING ============
   El TOKEN bloqueado sale del saldo de la partida del juego y se guarda en el libro demo.
   Al retirar, vuelve el capital más el interés pagado desde la reserva.
   Interés simple: monto × APY × días completos / 365. Tiempo = reloj del juego (simSec). */
let subTab = 'pools';
const notifiedUnlock = new Set();
let unlockReady = false;

function setStMsg(text, kind){
  const m = document.getElementById('stMsg');
  m.textContent = text; m.className = 'msg' + (kind ? ' ' + kind : '');
}
function toast(text, kind){
  let box = document.getElementById('toasts');
  if (!box){ box = document.createElement('div'); box.id = 'toasts'; box.className = 'toasts'; document.body.appendChild(box); }
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = text;
  box.appendChild(t);
  setTimeout(() => t.remove(), 4200);
}
function showSub(name){
  subTab = name;
  document.querySelectorAll('[data-sub-panel]').forEach(s => { s.hidden = s.dataset.subPanel !== name; });
  document.querySelectorAll('[data-sub]').forEach(b => b.classList.toggle('active', b.dataset.sub === name));
}
function stakeRows(d, demo){
  const now = d ? (d.simSec || 0) : null;
  return demo.stakes.map(st => {
    const days = now == null ? 0 : Math.max(0, Math.floor((now - st.start) / 86400));
    return {st, days, interest: Math.floor(st.amount * st.apy * days / 365), ready: days >= STAKE.lockDays && !!d};
  });
}
function renderSummary(d, demo){
  const rows = stakeRows(d, demo);
  const locked = rows.reduce((a, r) => a + r.st.amount, 0);
  const accrued = rows.reduce((a, r) => a + r.interest, 0);
  const best = Math.max(...Object.values(STAKE.apy));
  const cards = [
    ['TOKEN bloqueado', fmtAmt(locked)],
    ['Interés acumulado', fmtAmt(accrued)],
    ['APY más alto', (best*100).toFixed(1) + ' %'],
    ['Posiciones', String(rows.length)],
    ['Reserva demo', fmtAmt(demo.reserve)]
  ];
  document.getElementById('stSum').innerHTML = cards.map(([l, v]) =>
    `<div class="panel st-stat"><small>${l}</small><b>${v}</b></div>`).join('');
}
function renderPoolGrid(pool, demo){
  document.getElementById('poolGrid').innerHTML = Object.keys(STAKE.apy).map(s => {
    const mine = demo.stakes.filter(x => x.pool === s).reduce((a, x) => a + x.amount, 0);
    return `<button class="pool-card${s===pool?' sel':''}" data-pool="${s}" type="button">
      <span class="pc-name">TOKEN / ${s}</span>
      <span class="pc-apy">${(STAKE.apy[s]*100).toFixed(1)}<small> % APY</small></span>
      <span class="pc-meta">Bloqueo ${STAKE.lockDays} días</span>
      <span class="pc-meta">Tu posición: ${fmtAmt(mine)}</span>
    </button>`;
  }).join('');
}
function renderCalc(d, demo){
  const sel = document.getElementById('stPool');
  if (!sel.options.length){
    sel.innerHTML = Object.keys(STAKE.apy).map(s => `<option value="${s}">TOKEN / ${s}</option>`).join('');
  }
  const pool = sel.value;
  const amt = Math.floor(Number(document.getElementById('stAmt').value) || 0);
  const P = planetOf(d);
  document.getElementById('stBal').textContent = 'Disponible: ' + fmtAmt(P ? P.res.token : 0) + ' TOKEN';
  const apy = STAKE.apy[pool];
  const interest = Math.floor(amt * apy * STAKE.lockDays / 365);
  const now = d ? (d.simSec || 0) : null;
  const unlock = now == null ? '—' : fmtClock(now + STAKE.lockDays * 86400);
  document.getElementById('stQuote').innerHTML =
    `<div><span>APY</span><b>${(apy*100).toFixed(1)} %</b></div>
     <div><span>Interés a ${STAKE.lockDays} días</span><b>${fmtAmt(interest)} TOKEN</b></div>
     <div><span>Desbloqueo</span><b>${unlock}</b></div>
     <div><span>Reserva demo</span><b>${fmtAmt(demo.reserve)} TOKEN</b></div>`;
  document.getElementById('doStake').disabled = !d;
}
function renderPositions(d, demo){
  const rows = stakeRows(d, demo);
  const list = document.getElementById('stakeList');
  if (!rows.length){
    list.innerHTML = '<p class="empty" style="padding:0">Aún no tienes TOKEN bloqueado. Elige un pool en la pestaña Pools.</p>';
  } else {
    list.innerHTML = rows.map(r => {
      const pct = Math.min(100, Math.round(r.days / STAKE.lockDays * 100));
      const unlock = d ? fmtClock(r.st.start + STAKE.lockDays * 86400) : '—';
      return `<div class="panel pos-card">
        <div class="pc-top"><span>TOKEN / ${r.st.pool}</span><span>APY ${(r.st.apy*100).toFixed(1)} %</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="pc-row"><span>Día ${Math.min(r.days, STAKE.lockDays)} de ${STAKE.lockDays}</span><span>Capital <b>${fmtAmt(r.st.amount)}</b></span><span>Interés <b>${fmtAmt(r.interest)}</b></span></div>
        <div class="pc-row"><span>Desbloqueo: ${unlock}</span>
          <span class="pc-btns">
            <button class="btn compact" data-unstake="${r.st.id}" type="button" ${r.ready ? '' : 'disabled'}>Retirar</button>
            <button class="btn compact ghost" data-day="${r.st.id}" type="button">+1 día demo</button>
          </span>
        </div>
      </div>`;
    }).join('');
  }
  // Aviso una sola vez cuando una posición se desbloquea
  if (!unlockReady){
    rows.forEach(r => { if (r.ready) notifiedUnlock.add(r.st.id); });
    unlockReady = true;
  } else {
    rows.forEach(r => {
      if (r.ready && !notifiedUnlock.has(r.st.id)){
        notifiedUnlock.add(r.st.id);
        toast('Posición desbloqueada: TOKEN / ' + r.st.pool + '. Ya puedes retirar.', 'ok');
      }
    });
  }
}
function renderStakeHist(d){
  const box = document.getElementById('stHist');
  const rows = ((d && d.txs) || []).filter(t => /^(Staking|Retiro staking)/.test(String(t.type||'')));
  if (!rows.length){ box.innerHTML = '<p class="empty" style="padding:0">Aún no hay movimientos de staking.</p>'; return; }
  box.innerHTML = `<table><thead><tr><th>Hora</th><th>Operación</th><th class="r">Monto</th><th>Estado</th></tr></thead><tbody>
    ${rows.slice(0,30).map(t => `<tr><td class="mono">${fmtClock(t.t)}</td><td>${t.type}</td><td class="r mono">${t.amount>0?'+':''}${fmtAmt(t.amount)} TOKEN</td><td>${t.status||''}</td></tr>`).join('')}
  </tbody></table>`;
}
function renderStake(d, demo){
  renderCalc(d, demo);
  renderSummary(d, demo);
  renderPoolGrid(document.getElementById('stPool').value || 'USDT', demo);
  renderPositions(d, demo);
  renderStakeHist(d);
}
function doStake(){
  const d = readSave(), demo = readDemo();
  if (!d) return setStMsg('Necesitas una partida guardada para usar TOKEN. Abre el juego primero.', 'bad');
  const pool = document.getElementById('stPool').value;
  const amt = Math.floor(Number(document.getElementById('stAmt').value) || 0);
  if (amt <= 0) return setStMsg('Ingresa una cantidad válida.', 'bad');
  const P = planetOf(d);
  if ((P.res.token || 0) < amt) return setStMsg('Saldo insuficiente de TOKEN.', 'bad');
  P.res.token -= amt;
  demo.stakes.push({id:Date.now().toString(36), pool, amount:amt, start:d.simSec || 0, apy:STAKE.apy[pool]});
  d.txs = d.txs || [];
  d.txs.unshift({t:d.simSec || 0, type:'Staking TOKEN/' + pool, amount:-amt, status:'Bloqueado ' + STAKE.lockDays + ' días'});
  if (d.txs.length > 100) d.txs.length = 100;
  localStorage.setItem(sessionKey(), JSON.stringify(d));
  writeDemo(demo);
  document.getElementById('stAmt').value = '';
  setStMsg('Bloqueaste ' + fmtAmt(amt) + ' TOKEN en el pool ' + pool + '.', 'ok');
  refreshAll();
}
function unstake(id){
  const d = readSave(), demo = readDemo();
  if (!d) return setStMsg('Abre el juego para retirar.', 'bad');
  const i = demo.stakes.findIndex(s => s.id === id); if (i < 0) return;
  const st = demo.stakes[i];
  const days = Math.floor(((d.simSec || 0) - st.start) / 86400);
  if (days < STAKE.lockDays) return setStMsg('Faltan ' + (STAKE.lockDays - days) + ' días para retirar.', 'bad');
  const interest = Math.floor(st.amount * st.apy * days / 365);
  const paid = Math.min(interest, demo.reserve);
  const P = planetOf(d);
  P.res.token = (P.res.token || 0) + st.amount + paid;
  demo.reserve -= paid;
  demo.stakes.splice(i, 1);
  d.txs = d.txs || [];
  d.txs.unshift({t:d.simSec || 0, type:'Retiro staking TOKEN/' + st.pool, amount:st.amount + paid, status:'Completado'});
  if (d.txs.length > 100) d.txs.length = 100;
  localStorage.setItem(sessionKey(), JSON.stringify(d));
  writeDemo(demo);
  setStMsg(paid < interest
    ? 'Retiro completo. La reserva cubrió ' + fmtAmt(paid) + ' de ' + fmtAmt(interest) + ' TOKEN de interés.'
    : 'Retiro completo: ' + fmtAmt(st.amount) + ' TOKEN + ' + fmtAmt(paid) + ' de interés.', 'ok');
  refreshAll();
}
function addDemoDay(id){
  const demo = readDemo();
  const st = demo.stakes.find(s => s.id === id); if (!st) return;
  st.start -= 86400;   // solo demo: adelanta un día el inicio del bloqueo
  writeDemo(demo);
  refreshAll();
}
function setPct(p){
  const P = planetOf(readSave());
  if (!P) return;
  document.getElementById('stAmt').value = Math.floor((P.res.token || 0) * p / 100);
  refreshAll();
}

/* ============ SWAP ============ */
function quote(from, to, amt){ return amt * usdt(from) / usdt(to) * (1-FEE); }
function renderBalances(d, demo){
  const items = ALL.map(a => ({sym:a.sym, v:balanceOf(a.sym, d, demo)})).filter(x => x.v > 0 || x.sym==='TOKEN');
  const aviso = d ? '' : '<span>Sin partida guardada: abre el juego e inicia sesión para usar TOKEN.</span>';
  document.getElementById('bal').innerHTML = aviso + items.map(x => `<span>${x.sym} <b>${fmtAmt(x.v)}</b></span>`).join('');
}
function renderSwapForm(d, demo){
  const fromSel = document.getElementById('fromA'), toSel = document.getElementById('toA');
  if (!fromSel.options.length){
    const opts = ALL.map(a => `<option value="${a.sym}">${a.sym}</option>`).join('');
    fromSel.innerHTML = opts; toSel.innerHTML = opts;
    fromSel.value = 'TOKEN'; toSel.value = 'USDT';
  }
  const from = fromSel.value, to = toSel.value;
  document.getElementById('fromBal').textContent = 'Disponible: ' + fmtAmt(balanceOf(from, d, demo));
  document.getElementById('toBal').textContent = 'Saldo actual: ' + fmtAmt(balanceOf(to, d, demo));
  const amt = Number(document.getElementById('fromAmt').value) || 0;
  const out = amt>0 && from!==to ? quote(from,to,amt) : 0;
  document.getElementById('toAmt').value = out ? fmtAmt(out) : '';
  const rate = from===to ? 1 : quote(from,to,1)/(1-FEE);
  document.getElementById('rates').innerHTML = from===to
    ? '<span>Elige dos activos distintos.</span>'
    : `<span>1 ${from} ≈ <b>${fmtAmt(rate)}</b> ${to}</span><span>Comisión: <b>${(FEE*100).toFixed(1)} %</b> · Precio de referencia en USDT</span>`;
  document.getElementById('doSwap').disabled = !(from!==to);
}
function renderHistory(d, demo){
  const wrap = document.getElementById('histWrap');
  const rows = demo.hist || [];
  if (!rows.length){ wrap.innerHTML = '<p class="empty">Aún no hay operaciones de swap.</p>'; return; }
  wrap.innerHTML = `<table><thead><tr><th>Hora</th><th>Operación</th><th class="r">Recibido</th><th>Estado</th></tr></thead><tbody>
    ${rows.slice(0,20).map(r => `<tr><td class="mono">${fmtClock(r.t)}</td><td>${r.pay} → ${r.get}</td><td class="r mono">+${fmtAmt(r.out)} ${r.get}</td><td>Completado</td></tr>`).join('')}
  </tbody></table>`;
}
function setMsg(text, kind){
  const m = document.getElementById('msg');
  m.textContent = text; m.className = 'msg' + (kind ? ' ' + kind : '');
}
function doSwap(){
  const from = document.getElementById('fromA').value, to = document.getElementById('toA').value;
  if (from===to) return setMsg('Elige dos activos distintos.', 'bad');
  let amt = Number(document.getElementById('fromAmt').value) || 0;
  if (from==='TOKEN') amt = Math.floor(amt);
  if (amt<=0) return setMsg('Ingresa una cantidad válida.', 'bad');
  const d = readSave(), demo = readDemo();
  if ((from==='TOKEN' || to==='TOKEN') && !d) return setMsg('Para usar TOKEN necesitas una partida guardada. Abre el juego primero.', 'bad');
  const have = balanceOf(from, d, demo);
  if (have < amt) return setMsg('Saldo insuficiente de ' + from + '.', 'bad');
  const out = quote(from, to, amt);
  const get = to==='TOKEN' ? Math.floor(out) : Number(out.toFixed(6));
  if (get<=0) return setMsg('La cantidad es muy pequeña para ese intercambio.', 'bad');

  if (from==='TOKEN'){ planetOf(d).res.token -= amt; }
  else { demo.bal[from] = Number((have - amt).toFixed(6)); }
  if (to==='TOKEN'){ planetOf(d).res.token = (planetOf(d).res.token||0) + get; }
  else { demo.bal[to] = Number(((demo.bal[to]||0) + get).toFixed(6)); }

  demo.hist = demo.hist || [];
  demo.hist.unshift({t:(d && d.simSec) || 0, pay:from, get:to, out:get});
  if (demo.hist.length>100) demo.hist.length = 100;
  writeDemo(demo);
  if (d){
    d.txs = d.txs || [];
    d.txs.unshift({t:d.simSec||0, type:'Swap ' + from + ' → ' + to, amount:get, status:'Completado'});
    if (d.txs.length>100) d.txs.length = 100;
    if (from==='TOKEN' || to==='TOKEN') localStorage.setItem(sessionKey(), JSON.stringify(d));
  }
  setMsg('Recibiste ' + fmtAmt(get) + ' ' + to + '.', 'ok');
  document.getElementById('fromAmt').value = '';
  refreshAll();
}

/* ============ PESTAÑAS ============ */
function showView(v){
  view = v === 'stake' ? 'stake' : 'swap';
  document.getElementById('view-swap').hidden = view !== 'swap';
  document.getElementById('view-stake').hidden = view !== 'stake';
  document.querySelectorAll('.tab[data-view]').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
  refreshAll();
}

/* ============ REFRESCO GENERAL ============ */
function refreshAll(){
  const d = readSave(), demo = readDemo();
  if (view === 'swap'){
    renderPairs(); renderHeader(); renderTools(); drawChart();
    renderSwapForm(d, demo); renderHistory(d, demo);
  } else {
    renderMini(document.getElementById('stPool').value || 'USDT');
  }
  renderBalances(d, demo);
  renderStake(d, demo);
  renderWallet();
}

/* ============ EVENTOS ============ */
document.querySelectorAll('.tab[data-view]').forEach(t => t.addEventListener('click', () => showView(t.dataset.view)));
document.getElementById('pairList').addEventListener('click', e => {
  const b = e.target.closest('[data-pair]'); if (!b) return;
  cur = b.dataset.pair; hover = null; chartView.offset = 0; refreshAll();
});
document.getElementById('tfs').addEventListener('click', e => {
  const b = e.target.closest('[data-tf]'); if (!b) return;
  tf = b.dataset.tf; hover = null; pending = null; chartView.n = null; chartView.offset = 0; renderTfs(); refreshAll();
});
document.getElementById('tools').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.tool){ tool = t.dataset.tool; pending = null; renderTools(); drawChart(); return; }
  const act = t.dataset.act;
  if (act === 'clear'){ drawings[drawKey()] = []; pending = null; drawChart(); }
  else if (act === 'zoomin') zoomBy(0.8);
  else if (act === 'zoomout') zoomBy(1.25);
  else if (act === 'reset') resetView();
  else if (act === 'full') toggleFull();
});
function toggleFull(){
  const panel = document.getElementById('chartPanel');
  if (!document.fullscreenElement){
    (panel.requestFullscreen ? panel.requestFullscreen() : Promise.reject()).catch(() => setMsg('Tu navegador no permite pantalla completa aquí.', 'bad'));
  } else { document.exitFullscreen(); }
}
document.addEventListener('fullscreenchange', () => setTimeout(drawChart, 60));

const cv = document.getElementById('cv');
cv.addEventListener('wheel', e => {
  e.preventDefault();
  zoomBy(e.deltaY > 0 ? 1.15 : 0.87);
}, {passive:false});
cv.addEventListener('pointerdown', e => {
  if (!scale) return;
  const {x, y} = canvasXY(e);
  if (tool === 'cursor'){ drag = {x, off: chartView.offset}; cv.setPointerCapture(e.pointerId); return; }
  const p = pointFromXY(x, y);
  if (tool === 'hline'){ drawList().push({type:'hline', p1:p}); drawChart(); return; }
  pending = {type:tool, p1:p, p2:p};
  cv.setPointerCapture(e.pointerId);
  drawChart();
});
cv.addEventListener('pointermove', e => {
  if (!scale) return;
  const {x, y} = canvasXY(e);
  if (drag){
    const shift = Math.round((x - drag.x) / scale.step);
    const total = candles(cur, tf).length, n = scale.data.length;
    chartView.offset = Math.max(0, Math.min(total - n, drag.off + shift));
    drawChart(); renderOhlc(); return;
  }
  if (pending){ pending.p2 = pointFromXY(x, y); drawChart(); return; }
  const i = Math.floor((x - scale.padL) / scale.step);
  hover = (i>=0 && i<scale.data.length) ? i : null;
  renderOhlc(); drawChart();
});
function endPointer(){
  drag = null;
  if (pending){
    const dx = Math.abs(pending.p2.t - pending.p1.t), dy = Math.abs(pending.p2.p - pending.p1.p);
    if (dx > 0 || dy > 0) drawList().push({type:pending.type, p1:pending.p1, p2:pending.p2});
    pending = null; drawChart();
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('mouseleave', () => { if (!drag && !pending){ hover = null; renderOhlc(); drawChart(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && pending){ pending = null; drawChart(); }
});
window.addEventListener('resize', () => { drawChart(); renderMini(document.getElementById('stPool').value || 'USDT'); });
window.addEventListener('storage', e => { if (e.key===sessionKey() || e.key===demoKey()) refreshAll(); });

['fromA','toA','fromAmt'].forEach(id => document.getElementById(id).addEventListener('input', refreshAll));
document.getElementById('fromA').addEventListener('change', refreshAll);
document.getElementById('toA').addEventListener('change', refreshAll);
document.getElementById('flip').addEventListener('click', () => {
  const f = document.getElementById('fromA'), t = document.getElementById('toA');
  const tmp = f.value; f.value = t.value; t.value = tmp; refreshAll();
});
document.getElementById('doSwap').addEventListener('click', doSwap);

document.getElementById('doStake').addEventListener('click', doStake);
document.getElementById('stPool').addEventListener('change', refreshAll);
document.getElementById('stAmt').addEventListener('input', refreshAll);
document.getElementById('poolGrid').addEventListener('click', e => {
  const r = e.target.closest('[data-pool]'); if (!r) return;
  document.getElementById('stPool').value = r.dataset.pool; refreshAll();
});
document.getElementById('view-stake').addEventListener('click', e => {
  const s = e.target.closest('[data-sub]'); if (s) return showSub(s.dataset.sub);
  const c = e.target.closest('[data-pct]'); if (c) return setPct(Number(c.dataset.pct));
  const u = e.target.closest('[data-unstake]'); if (u) return unstake(u.dataset.unstake);
  const dd = e.target.closest('[data-day]'); if (dd) addDemoDay(dd.dataset.day);
});
const wbtn = document.getElementById('walletBtn'), wmenu = document.getElementById('walletMenu');
wbtn.addEventListener('click', e => { e.stopPropagation(); wmenu.hidden = !wmenu.hidden; renderWallet(); });
wmenu.addEventListener('click', e => {
  const b = e.target.closest('[data-wallet]'); if (!b) return;
  connectWallet(b.dataset.wallet);
});
document.addEventListener('click', e => {
  if (!document.getElementById('wwrap').contains(e.target)){ wmenu.hidden = true; renderWallet(); }
});

renderTfs();
showView(location.hash === '#stake' ? 'stake' : 'swap');
showSub('pools');
</script>
