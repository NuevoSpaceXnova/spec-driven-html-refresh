<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forja Astral · Swap</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Swap · mismo lenguaje visual que Forja Astral (consola táctica) */
:root{
  --bg-app:#0B0D10; --bg-panel:#0E1220; --bg-surface:#151C2B;
  --border-subtle:#1E2A44; --border-active:#2F63D1;
  --text-primary:#FFFFFF; --text-secondary:#D4DCED; --text-muted:#A8B5D1;
  --accent-primary:#2450C5; --accent-hover:#3266E0; --accent-text:#8FB4FF;
  --up:#3DF08F; --down:#FF4444;
  --font-sans:'Rajdhani',sans-serif; --font-title:'Orbitron',sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:4px;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--border-subtle) transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at top,#131a33 0%,var(--bg-app) 60%);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.4}
button,input,select{font-family:inherit}

/* Cabecera */
.top{position:sticky;top:0;z-index:5;min-height:56px;display:flex;align-items:center;gap:18px;padding:8px 20px;background:var(--bg-panel);border-bottom:1px solid var(--border-subtle);flex-wrap:wrap}
.top a.back{color:var(--accent-text);text-decoration:none;font:600 12px var(--font-title);letter-spacing:.08em}
.top a.back:hover{color:var(--text-primary)}
.top h1{margin:0;font:600 15px var(--font-title);letter-spacing:.1em}
.bal{margin-left:auto;display:flex;gap:14px;font:500 12px var(--font-mono);color:var(--text-secondary);flex-wrap:wrap}
.bal b{color:var(--text-primary);font-weight:600}
.tag{font:500 10px var(--font-mono);color:var(--text-muted);border:1px solid var(--border-subtle);border-radius:2px;padding:2px 6px;text-transform:uppercase;letter-spacing:.1em}

/* Rejilla */
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:14px;padding:14px;max-width:1440px;margin:0 auto}
.panel{background:linear-gradient(rgba(6,8,12,.5),rgba(6,8,12,.6)),var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--r);padding:14px;min-width:0}
.panel h3{margin:0 0 10px;font:600 11px var(--font-title);letter-spacing:.14em;text-transform:uppercase;color:var(--text-secondary)}
.pairs{grid-column:1;grid-row:1 / span 2;align-self:start;max-height:calc(100vh - 100px);overflow:auto}
.chart{grid-column:2;grid-row:1}
.hist{grid-column:2;grid-row:2}
.side{grid-column:3;grid-row:1 / span 2;align-self:start;display:flex;flex-direction:column;gap:14px}

/* Mercados */
.pair{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:transparent;border:1px solid transparent;border-radius:var(--r);padding:7px 9px;color:var(--text-primary);cursor:pointer;text-align:left}
.pair:hover{background:rgba(36,80,197,.18)}
.pair.active{background:var(--bg-surface);border-color:var(--border-active)}
.pair .nm{font:600 14px var(--font-sans);letter-spacing:.04em}
.pair .sub{font:500 10px var(--font-mono);color:var(--text-muted)}
.pair .px{font:500 12px var(--font-mono);text-align:right;color:var(--text-primary)}
.pair .chg{font:500 11px var(--font-mono);text-align:right}
.up{color:var(--up)} .down{color:var(--down)}

/* Gráfica */
.chart-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.chart-head .nm{font:600 16px var(--font-title);letter-spacing:.06em}
.chart-head .px{font:600 18px var(--font-mono)}
.chart-head .chg{font:500 12px var(--font-mono)}
.tfs{margin-left:auto;display:flex;gap:4px}
.tf{background:var(--bg-surface);border:1px solid var(--border-subtle);color:var(--text-muted);border-radius:var(--r);height:28px;padding:0 10px;font:500 12px var(--font-mono);cursor:pointer}
.tf.active{color:var(--text-primary);border-color:var(--border-active);background:linear-gradient(180deg,#1E3F9E,#2450C5)}
.ohlc{font:500 11px var(--font-mono);color:var(--text-muted);margin-bottom:6px;min-height:16px;display:flex;gap:12px;flex-wrap:wrap}
.ohlc b{color:var(--text-primary);font-weight:500}
#cv{display:block;width:100%;height:380px;cursor:crosshair;border:1px solid var(--border-subtle);border-radius:var(--r);background:var(--bg-app)}
.foot{margin-top:8px;font:500 10px var(--font-mono);color:var(--text-muted);letter-spacing:.04em;line-height:1.5}

/* Historial */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 10px var(--font-sans);text-transform:uppercase;letter-spacing:.12em;color:var(--text-secondary);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border-subtle);background:var(--bg-surface)}
td{padding:9px 10px;border-bottom:1px solid var(--border-subtle)}
.mono{font-family:var(--font-mono);font-size:12px}
.r{text-align:right}
.empty{color:var(--text-muted);padding:12px 10px}

/* Billeteras */
.wlist{display:flex;flex-direction:column;gap:6px}
.wbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:var(--bg-app);border:1px solid var(--border-subtle);border-radius:var(--r);padding:8px 10px;color:var(--text-primary);cursor:pointer;font:600 13px var(--font-sans)}
.wbtn:hover:not(:disabled){border-color:var(--border-active)}
.wbtn small{font:500 10px var(--font-mono);color:var(--text-muted)}
.wbtn:disabled{cursor:not-allowed;opacity:.6}
.wconn{font:500 12px var(--font-mono);color:var(--text-secondary);word-break:break-all;margin-bottom:8px}
.wconn b{color:var(--up);font-weight:600}
.link{background:none;border:0;color:var(--accent-text);font:500 12px var(--font-mono);cursor:pointer;padding:0;text-decoration:underline}

/* Swap */
.field{background:var(--bg-app);border:1px solid var(--border-subtle);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.field label{font:600 10px var(--font-sans);text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted)}
.field .row{display:flex;gap:8px;align-items:center}
.field small{font:500 11px var(--font-mono);color:var(--text-muted)}
.sel,.amt{height:38px;background:var(--bg-surface);color:var(--text-primary);border:1px solid var(--border-subtle);border-radius:var(--r);padding:0 10px;font:500 13px var(--font-mono)}
.sel{min-width:130px}
.amt{flex:1;min-width:0;text-align:right}
.amt[readonly]{color:var(--accent-text)}
.sel:focus-visible,.amt:focus-visible{outline:none;border-color:var(--accent-primary)}
.flip{display:block;margin:6px auto;width:36px;height:30px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--r);color:var(--accent-text);cursor:pointer;font-size:16px}
.flip:hover{border-color:var(--border-active)}
.rates{margin:10px 0;display:flex;flex-direction:column;gap:4px;font:500 11px var(--font-mono);color:var(--text-muted)}
.rates b{color:var(--text-primary);font-weight:500}
.btn{width:100%;height:42px;background:linear-gradient(180deg,#2450C5,#1B3A99);border:1px solid var(--accent-primary);color:#fff;border-radius:var(--r);font:600 13px var(--font-title);letter-spacing:.08em;cursor:pointer;text-transform:uppercase}
.btn:hover:not(:disabled){background:var(--accent-hover)}
.btn:disabled{background:var(--bg-surface);border-color:var(--border-subtle);color:var(--text-muted);cursor:not-allowed}
.msg{min-height:18px;margin:10px 0 0;font:500 12px var(--font-mono);color:var(--text-secondary)}
.msg.bad{color:var(--down)}
.msg.ok{color:var(--up)}

@media (max-width:1100px){
  .wrap{grid-template-columns:minmax(0,1fr) 320px}
  .pairs{grid-column:1 / -1;grid-row:auto;max-height:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px}
  .pairs h3{grid-column:1 / -1}
  .chart{grid-column:1;grid-row:auto}
  .side{grid-column:2;grid-row:auto}
  .hist{grid-column:1 / -1;grid-row:auto}
}
@media (max-width:720px){
  .wrap{grid-template-columns:minmax(0,1fr);padding:10px}
  .chart,.side,.hist{grid-column:1}
  #cv{height:300px}
  .bal{margin-left:0;width:100%}
  .tfs{margin-left:0}
}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="forja-astral.html">◂ FORJA ASTRAL</a>
  <h1>SWAP</h1>
  <span class="tag">Datos ficticios · demo</span>
  <div class="bal" id="bal"></div>
</header>

<div class="wrap">
  <aside class="panel pairs">
    <h3>Mercados · BNB Chain</h3>
    <div id="pairList"></div>
  </aside>

  <section class="panel chart">
    <div class="chart-head">
      <span class="nm" id="pName"></span>
      <span class="px" id="pPrice"></span>
      <span class="chg" id="pChg"></span>
      <div class="tfs" id="tfs"></div>
    </div>
    <div class="ohlc" id="ohlc"></div>
    <canvas id="cv"></canvas>
    <div class="foot">Precios generados en el navegador para la demo. Para precios reales, sustituir genPath() por datos de una API de mercado.</div>
  </section>

  <div class="side">
    <section class="panel">
      <h3>Billetera</h3>
      <div id="walletBox"></div>
    </section>

    <section class="panel">
      <h3>Intercambio</h3>
      <div class="field">
        <label for="fromA">Desde</label>
        <div class="row">
          <select class="sel" id="fromA"></select>
          <input class="amt" id="fromAmt" type="number" min="0" step="any" placeholder="0">
        </div>
        <small id="fromBal"></small>
      </div>
      <button class="flip" id="flip" type="button" aria-label="Invertir par">⇅</button>
      <div class="field">
        <label for="toA">Hacia</label>
        <div class="row">
          <select class="sel" id="toA"></select>
          <input class="amt" id="toAmt" type="text" readonly value="">
        </div>
        <small id="toBal"></small>
      </div>
      <div class="rates" id="rates"></div>
      <button class="btn" id="doSwap" type="button">Intercambiar</button>
      <p class="msg" id="msg"></p>
    </section>
  </div>

  <section class="panel hist">
    <h3>Operaciones de swap</h3>
    <div id="histWrap"></div>
  </section>
</div>

<script>
/* ==========================================================================
   CONFIGURACIÓN PARA LA INTEGRACIÓN OFICIAL
   - contract: dirección del token en BNB Smart Chain. Pendiente: completar
     desde BscScan o la fuente oficial cuando el token se liste.
   - Las direcciones de las criptos también quedan en null hasta verificarlas
     en una fuente oficial. No se inventan aquí.
   ========================================================================== */
const CHAIN = {
  name:'BNB Smart Chain', chainId:56, hex:'0x38',
  rpc:['https://bsc-dataseed.binance.org/'],
  explorer:'https://bscscan.com', currency:{name:'BNB', symbol:'BNB', decimals:18}
};
const TOKEN = {sym:'TOKEN', name:'Token Forja Astral', contract:null, decimals:18, inGame:true, start:0.80, vol:0.0015};
const CRYPTOS = [
  {sym:'USDT',  name:'Tether USD',    start:1,      vol:0.00002, stable:true, contract:null},
  {sym:'USDC',  name:'USD Coin',      start:1,      vol:0.00002, stable:true, contract:null},
  {sym:'BNB',   name:'BNB',           start:600,    vol:0.0008,  contract:null},
  {sym:'BTCB',  name:'Bitcoin (BTCB)',start:65000,  vol:0.0006,  contract:null},
  {sym:'ETH',   name:'Ethereum',      start:3200,   vol:0.0009,  contract:null},
  {sym:'CAKE',  name:'PancakeSwap',   start:2.5,    vol:0.0016,  contract:null},
  {sym:'XRP',   name:'XRP',           start:0.6,    vol:0.0013,  contract:null},
  {sym:'ADA',   name:'Cardano',       start:0.45,   vol:0.0014,  contract:null},
  {sym:'DOGE',  name:'Dogecoin',      start:0.15,   vol:0.0018,  contract:null},
  {sym:'LINK',  name:'Chainlink',     start:14,     vol:0.0013,  contract:null},
  {sym:'DOT',   name:'Polkadot',      start:6.5,    vol:0.0013,  contract:null},
  {sym:'LTC',   name:'Litecoin',      start:80,     vol:0.0011,  contract:null},
  {sym:'TRX',   name:'TRON',          start:0.13,   vol:0.0009,  contract:null},
  {sym:'UNI',   name:'Uniswap',       start:8,      vol:0.0015,  contract:null},
  {sym:'MATIC', name:'Polygon',       start:0.55,   vol:0.0018,  contract:null}
];
const FEE = 0.003;                              // comisión del swap (0,3 %)
const N_MIN = 43200;                            // 30 días de velas de 1 minuto (ficticias)
const TF = {'1m':{size:1,show:120,label:'1m'}, '1h':{size:60,show:120,label:'1H'}, '1d':{size:1440,show:30,label:'1D'}};
const ALL = [TOKEN, ...CRYPTOS];                // todos los activos del swap
const PAIRS = ALL.filter(a => a.sym !== 'USDT');// mercados graficados contra USDT
const BY = Object.fromEntries(ALL.map(a => [a.sym, a]));

/* ============ DATOS FICTICIOS (reemplazar por API real) ============ */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for (let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function gauss(r){ let u=0; while(u===0) u=r(); const v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const T0 = Math.floor(Date.now()/1000) - N_MIN*60;
const paths = {};
function genPath(a){
  const r = mulberry32(hashStr(a.sym));
  const out = new Array(N_MIN);
  let cur = a.start;
  for (let i=0;i<N_MIN;i++){
    const o = cur;
    const c = Math.max(o*(1+gauss(r)*a.vol), 1e-8);
    const wick = Math.abs(gauss(r))*a.vol*0.5;
    out[i] = {t:T0+i*60, o, h:Math.max(o,c)*(1+wick), l:Math.max(Math.min(o,c)*(1-wick),1e-8), c, v:100+r()*900};
    cur = c;
  }
  return out;
}
ALL.forEach(a => { if (a.sym!=='USDT') paths[a.sym] = genPath(a); });

function candles(sym, tf){
  const size = TF[tf].size, path = paths[sym], out = [];
  for (let i=0;i<path.length;i+=size){
    const end = Math.min(i+size, path.length);
    let h=-Infinity, l=Infinity, v=0;
    for (let j=i;j<end;j++){ if(path[j].h>h) h=path[j].h; if(path[j].l<l) l=path[j].l; v+=path[j].v; }
    out.push({t:path[i].t, o:path[i].o, h, l, c:path[end-1].c, v});
  }
  return out;
}
// Precio en USDT de cualquier activo
function usdt(sym){ if (sym==='USDT') return 1; const p = paths[sym]; return p[p.length-1].c; }
function changeFor(sym){
  if (sym==='USDT') return 0;
  const p = paths[sym]; const now = p[p.length-1].c, prev = p[Math.max(0,p.length-1440)].o;
  return (now-prev)/prev;
}
// Movimiento en vivo: cambia solo la última vela de 1 minuto
setInterval(() => {
  PAIRS.forEach(a => {
    const last = paths[a.sym][N_MIN-1];
    const nc = Math.max(last.c*(1+gauss(Math.random)*a.vol*0.25), 1e-8);
    last.c = nc; if (nc>last.h) last.h = nc; if (nc<last.l) last.l = nc;
  });
  refreshAll();
}, 2000);

/* ============ FORMATO ============ */
function fmtPrice(v){ return v>=100 ? v.toLocaleString('es-ES',{maximumFractionDigits:2,minimumFractionDigits:2}) : v>=1 ? v.toFixed(3) : v.toFixed(v<0.01?6:4); }
function fmtAmt(n){ const x = Number(n)||0; return x>=1000 ? x.toLocaleString('es-ES',{maximumFractionDigits:2}) : x>=1 ? x.toLocaleString('es-ES',{maximumFractionDigits:4}) : x.toFixed(6); }
function fmtClock(t){
  const s = Math.floor(t||0), day = Math.floor(s/86400)+1, hh = Math.floor((s%86400)/3600), mm = Math.floor((s%3600)/60);
  return 'Día ' + day + ' · ' + String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
}
function fmtTime(t, frame){
  const d = new Date(t*1000);
  return frame==='1d' ? d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'}) : d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
}
function short(a){ return a ? a.slice(0,6) + '…' + a.slice(-4) : ''; }

/* ============ PARTIDA DEL JUEGO Y SALDOS DEMO ============ */
function userSuffix(){ try { return localStorage.getItem('forja-astral-session') || ''; } catch(e){ return ''; } }
function sessionKey(){ const u = userSuffix(); return u ? 'forja-astral-save-v2:' + u : 'forja-astral-save-v2'; }
function demoKey(){ const u = userSuffix(); return 'forja-astral-swap-demo' + (u ? ':' + u : ''); }
function readSave(){ try { const raw = localStorage.getItem(sessionKey()); return raw ? JSON.parse(raw) : null; } catch(e){ return null; } }
function planetOf(d){ return d ? ((d.planets||[])[d.active||0] || (d.planets||[])[0] || null) : null; }
// Saldos demo de criptos (no tocan la partida del juego). Empiezan con 500 USDT ficticios.
function readDemo(){
  try { const raw = localStorage.getItem(demoKey()); if (raw) return JSON.parse(raw); } catch(e){}
  return {bal:{USDT:500}, hist:[]};
}
function writeDemo(x){ localStorage.setItem(demoKey(), JSON.stringify(x)); }

function balanceOf(sym, d, demo){
  if (sym==='TOKEN'){ const P = planetOf(d); return P ? (P.res.token||0) : 0; }
  return (demo.bal[sym]||0);
}

/* ============ BILLETERAS (preparadas para integración) ============
   EVM (MetaMask, Ronin, Trust, etc.): EIP-6963 para detectar cada extensión por separado.
   Solana (Solflare, Phantom): proveedores inyectados. Ronin también expone window.ronin.
   Aquí solo se conecta y se cambia la red. Las transacciones on-chain quedan pendientes. */
const evmProviders = new Map();
window.addEventListener('eip6963:announceProvider', e => { evmProviders.set(e.detail.info.uuid, e.detail); renderWallet(); });
window.dispatchEvent(new Event('eip6963:requestProvider'));

let wallet = null;     // {kind:'evm'|'sol', name, address, provider}

function detectWallets(){
  const list = [];
  evmProviders.forEach(d => list.push({id:'evm:'+d.info.uuid, kind:'evm', name:d.info.name, provider:d.provider, note:'EVM · BNB Chain'}));
  if (!evmProviders.size && window.ethereum) list.push({id:'evm:injected', kind:'evm', name:'Wallet inyectada', provider:window.ethereum, note:'EVM · BNB Chain'});
  if (window.ronin && window.ronin.provider) list.push({id:'evm:ronin', kind:'evm', name:'Ronin Wallet', provider:window.ronin.provider, note:'EVM · Red Ronin (cambiar a BNB)'});
  if (window.solflare && window.solflare.isSolflare) list.push({id:'sol:solflare', kind:'sol', name:'Solflare', provider:window.solflare, note:'Solana · no es BNB Chain'});
  if (window.phantom && window.phantom.solana) list.push({id:'sol:phantom', kind:'sol', name:'Phantom', provider:window.phantom.solana, note:'Solana · no es BNB Chain'});
  return list;
}
async function ensureBsc(p){
  const cur = await p.request({method:'eth_chainId'});
  if (cur === CHAIN.hex) return true;
  try { await p.request({method:'wallet_switchEthereumChain', params:[{chainId:CHAIN.hex}]}); return true; }
  catch (err){
    if (err && err.code === 4902){
      await p.request({method:'wallet_addEthereumChain', params:[{chainId:CHAIN.hex, chainName:CHAIN.name, nativeCurrency:CHAIN.currency, rpcUrls:CHAIN.rpc, blockExplorerUrls:[CHAIN.explorer]}]});
      return true;
    }
    throw err;
  }
}
async function connectWallet(id){
  const w = detectWallets().find(x => x.id === id);
  if (!w) return setMsg('Esa billetera ya no está disponible. Revisa que la extensión esté activa.', 'bad');
  try {
    if (w.kind === 'evm'){
      const acc = await w.provider.request({method:'eth_requestAccounts'});
      if (!acc || !acc[0]) throw new Error('Sin cuenta');
      if (!w.note.includes('Ronin')) await ensureBsc(w.provider);
      wallet = {kind:'evm', name:w.name, address:acc[0], provider:w.provider};
    } else {
      const res = await w.provider.connect();
      wallet = {kind:'sol', name:w.name, address:res.publicKey.toString(), provider:w.provider};
    }
    setMsg('Conectado con ' + wallet.name + '.', 'ok');
  } catch (err){
    setMsg('No se pudo conectar: ' + ((err && err.message) || 'cancelado'), 'bad');
  }
  renderWallet();
}
function disconnectWallet(){ wallet = null; setMsg('Billetera desconectada.'); renderWallet(); }

/* ============ ESTADO Y RENDER ============ */
let cur = 'TOKEN';
let tf = '1m';
let hover = null;

function renderPairs(){
  document.getElementById('pairList').innerHTML = PAIRS.map(a => {
    const ch = changeFor(a.sym);
    return `<button class="pair${a.sym===cur?' active':''}" data-pair="${a.sym}" type="button">
      <span><span class="nm">${a.sym} / USDT</span><br><span class="sub">${a.inGame ? 'Token del juego' : a.name}</span></span>
      <span><span class="px">${fmtPrice(usdt(a.sym))}</span><br><span class="chg ${ch>=0?'up':'down'}">${ch>=0?'+':''}${(ch*100).toFixed(2)}%</span></span>
    </button>`;
  }).join('');
}
function renderTfs(){
  document.getElementById('tfs').innerHTML = Object.keys(TF).map(k =>
    `<button class="tf${k===tf?' active':''}" data-tf="${k}" type="button">${TF[k].label}</button>`).join('');
}
function visible(){ return candles(cur, tf).slice(-TF[tf].show); }
function renderHeader(){
  const ch = changeFor(cur);
  document.getElementById('pName').textContent = cur + ' / USDT';
  document.getElementById('pPrice').textContent = fmtPrice(usdt(cur));
  const chg = document.getElementById('pChg');
  chg.textContent = (ch>=0?'+':'') + (ch*100).toFixed(2) + '% (24 h)';
  chg.className = 'chg ' + (ch>=0?'up':'down');
  renderOhlc();
}
function renderOhlc(){
  const data = visible(); if (!data.length) return;
  const c = (hover!=null && data[hover]) ? data[hover] : data[data.length-1];
  document.getElementById('ohlc').innerHTML =
    `<span>${fmtTime(c.t, tf)}</span><span>A <b>${fmtPrice(c.o)}</b></span><span>M <b>${fmtPrice(c.h)}</b></span><span>m <b>${fmtPrice(c.l)}</b></span><span>C <b>${fmtPrice(c.c)}</b></span><span>Vol <b>${fmtAmt(c.v)}</b></span>`;
}
function drawChart(){
  const cv = document.getElementById('cv');
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const data = visible(); if (!data.length) return;

  const padL=10, padR=76, padT=12, padB=24;
  const pw = W-padL-padR, ph = H-padT-padB;
  let lo=Infinity, hi=-Infinity;
  data.forEach(c => { if(c.l<lo) lo=c.l; if(c.h>hi) hi=c.h; });
  const m = (hi-lo)*0.06 || hi*0.01;
  lo -= m; hi += m;
  const Y = v => padT + (hi-v)/(hi-lo)*ph;

  ctx.font = '11px "IBM Plex Mono", monospace';
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(30,42,68,.95)';
  ctx.fillStyle = '#A8B5D1';
  for (let i=0;i<=4;i++){
    const v = hi-(hi-lo)*i/4, y = Math.round(Y(v))+0.5;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText(fmtPrice(v), W-padR+8, y+4);
  }
  const step = pw/data.length, bw = Math.max(2, step*0.6);
  data.forEach((c,i) => {
    const x = padL+(i+0.5)*step, col = c.c>=c.o ? '#3DF08F' : '#FF4444';
    ctx.strokeStyle = col;
    ctx.beginPath(); ctx.moveTo(Math.round(x)+0.5, Y(c.h)); ctx.lineTo(Math.round(x)+0.5, Y(c.l)); ctx.stroke();
    const yo = Y(c.o), yc = Y(c.c);
    ctx.fillStyle = col;
    ctx.fillRect(x-bw/2, Math.min(yo,yc), bw, Math.max(1, Math.abs(yc-yo)));
  });
  const every = Math.max(1, Math.floor(data.length/6));
  ctx.fillStyle = '#A8B5D1';
  data.forEach((c,i) => { if (i%every===0) ctx.fillText(fmtTime(c.t, tf), padL+(i+0.5)*step-18, H-7); });

  const last = data[data.length-1], yl = Math.round(Y(last.c))+0.5;
  const lc = last.c>=last.o ? '#3DF08F' : '#FF4444';
  ctx.setLineDash([4,4]); ctx.strokeStyle = lc;
  ctx.beginPath(); ctx.moveTo(padL,yl); ctx.lineTo(W-padR,yl); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = lc; ctx.fillRect(W-padR+2, yl-9, padR-4, 18);
  ctx.fillStyle = '#06080C'; ctx.fillText(fmtPrice(last.c), W-padR+6, yl+4);
  if (hover!=null && hover<data.length){
    const x = Math.round(padL+(hover+0.5)*step)+0.5;
    ctx.strokeStyle = 'rgba(143,180,255,.6)'; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,H-padB); ctx.stroke();
    ctx.setLineDash([]);
  }
}

function renderBalances(d, demo){
  const items = ALL.map(a => ({sym:a.sym, v:balanceOf(a.sym, d, demo)})).filter(x => x.v > 0 || x.sym==='TOKEN');
  const aviso = d ? '' : '<span>Sin partida guardada: abre el juego e inicia sesión para usar TOKEN.</span>';
  document.getElementById('bal').innerHTML = aviso + items.map(x => `<span>${x.sym} <b>${fmtAmt(x.v)}</b></span>`).join('');
}
function renderWallet(){
  const box = document.getElementById('walletBox');
  if (wallet){
    box.innerHTML = `<div class="wconn">Conectado · ${wallet.name}<br><b>${short(wallet.address)}</b></div>
      <button class="btn" type="button" id="wDisc" style="height:34px;font-size:11px">Desconectar</button>`;
    document.getElementById('wDisc').onclick = disconnectWallet;
    return;
  }
  const list = detectWallets();
  const body = list.length
    ? list.map(w => `<button class="wbtn" type="button" data-wallet="${w.id}"><span>${w.name}</span><small>${w.note}</small></button>`).join('')
    : '<p class="empty" style="padding:0">No se detectó ninguna billetera. Instala MetaMask, Solflare, Phantom o Ronin Wallet y recarga la página.</p>';
  box.innerHTML = `<div class="wlist">${body}</div>
    <p class="foot" style="margin-top:10px">Conexión preparada. Las transacciones on-chain del token se activarán con la integración oficial.</p>`;
}

function quote(from, to, amt){ return amt * usdt(from) / usdt(to) * (1-FEE); }
function renderSwapForm(d, demo){
  const fromSel = document.getElementById('fromA'), toSel = document.getElementById('toA');
  if (!fromSel.options.length){
    const opts = ALL.map(a => `<option value="${a.sym}">${a.sym}</option>`).join('');
    fromSel.innerHTML = opts; toSel.innerHTML = opts;
    fromSel.value = 'TOKEN'; toSel.value = 'USDT';
  }
  const from = fromSel.value, to = toSel.value;
  document.getElementById('fromBal').textContent = 'Disponible: ' + fmtAmt(balanceOf(from, d, demo));
  document.getElementById('toBal').textContent = 'Saldo actual: ' + fmtAmt(balanceOf(to, d, demo));
  const amt = Number(document.getElementById('fromAmt').value) || 0;
  const out = amt>0 && from!==to ? quote(from,to,amt) : 0;
  document.getElementById('toAmt').value = out ? fmtAmt(out) : '';
  const rate = from===to ? 1 : quote(from,to,1)/(1-FEE);
  document.getElementById('rates').innerHTML = from===to
    ? '<span>Elige dos activos distintos.</span>'
    : `<span>1 ${from} ≈ <b>${fmtAmt(rate)}</b> ${to}</span><span>Comisión: <b>${(FEE*100).toFixed(1)} %</b> · Precio de referencia en USDT</span>`;
  document.getElementById('doSwap').disabled = !(from!==to);
}

function renderHistory(d, demo){
  const wrap = document.getElementById('histWrap');
  const rows = demo.hist || [];
  if (!rows.length){ wrap.innerHTML = '<p class="empty">Aún no hay operaciones de swap.</p>'; return; }
  wrap.innerHTML = `<table><thead><tr><th>Hora</th><th>Operación</th><th class="r">Recibido</th><th>Estado</th></tr></thead><tbody>
    ${rows.slice(0,20).map(r => `<tr><td class="mono">${fmtClock(r.t)}</td><td>${r.pay} → ${r.get}</td><td class="r mono">+${fmtAmt(r.out)} ${r.get}</td><td>Completado</td></tr>`).join('')}
  </tbody></table>`;
}

function refreshAll(){
  const d = readSave(), demo = readDemo();
  renderPairs(); renderHeader(); drawChart();
  renderBalances(d, demo); renderSwapForm(d, demo); renderHistory(d, demo);
}

/* ============ SWAP (saldos del juego para TOKEN, saldos demo para criptos) ============ */
function setMsg(text, kind){
  const m = document.getElementById('msg');
  m.textContent = text; m.className = 'msg' + (kind ? ' ' + kind : '');
}
function doSwap(){
  const from = document.getElementById('fromA').value, to = document.getElementById('toA').value;
  if (from===to) return setMsg('Elige dos activos distintos.', 'bad');
  let amt = Number(document.getElementById('fromAmt').value) || 0;
  if (from==='TOKEN') amt = Math.floor(amt);   // el token del juego se maneja en unidades enteras
  if (amt<=0) return setMsg('Ingresa una cantidad válida.', 'bad');
  const d = readSave(), demo = readDemo();
  if ((from==='TOKEN' || to==='TOKEN') && !d) return setMsg('Para usar TOKEN necesitas una partida guardada. Abre el juego primero.', 'bad');
  const have = balanceOf(from, d, demo);
  if (have < amt) return setMsg('Saldo insuficiente de ' + from + '.', 'bad');
  const out = quote(from, to, amt);
  const get = to==='TOKEN' ? Math.floor(out) : Number(out.toFixed(6));
  if (get<=0) return setMsg('La cantidad es muy pequeña para ese intercambio.', 'bad');

  // Descontar origen
  if (from==='TOKEN'){ planetOf(d).res.token -= amt; }
  else { demo.bal[from] = Number((have - amt).toFixed(6)); }
  // Acreditar destino
  if (to==='TOKEN'){ planetOf(d).res.token = (planetOf(d).res.token||0) + get; }
  else { demo.bal[to] = Number(((demo.bal[to]||0) + get).toFixed(6)); }

  demo.hist = demo.hist || [];
  demo.hist.unshift({t:(d && d.simSec) || 0, pay:from, get:to, out:get});
  if (demo.hist.length>100) demo.hist.length = 100;
  writeDemo(demo);
  if (d){
    d.txs = d.txs || [];
    d.txs.unshift({t:d.simSec||0, type:'Swap ' + from + ' → ' + to, amount:get, status:'Completado'});
    if (d.txs.length>100) d.txs.length = 100;
    if (from==='TOKEN' || to==='TOKEN') localStorage.setItem(sessionKey(), JSON.stringify(d));
  }
  setMsg('Recibiste ' + fmtAmt(get) + ' ' + to + '.', 'ok');
  document.getElementById('fromAmt').value = '';
  refreshAll();
}

/* ============ EVENTOS ============ */
document.getElementById('pairList').addEventListener('click', e => {
  const b = e.target.closest('[data-pair]'); if (!b) return;
  cur = b.dataset.pair; hover = null; refreshAll();
});
document.getElementById('tfs').addEventListener('click', e => {
  const b = e.target.closest('[data-tf]'); if (!b) return;
  tf = b.dataset.tf; hover = null; renderTfs(); refreshAll();
});
document.getElementById('walletBox').addEventListener('click', e => {
  const b = e.target.closest('[data-wallet]'); if (!b) return;
  connectWallet(b.dataset.wallet);
});
const cv = document.getElementById('cv');
cv.addEventListener('mousemove', e => {
  const data = visible(); if (!data.length) return;
  const rect = cv.getBoundingClientRect();
  const i = Math.floor((e.clientX-rect.left-10)/((rect.width-86)/data.length));
  hover = (i>=0 && i<data.length) ? i : null;
  renderOhlc(); drawChart();
});
cv.addEventListener('mouseleave', () => { hover = null; renderOhlc(); drawChart(); });
window.addEventListener('resize', drawChart);
window.addEventListener('storage', e => { if (e.key===sessionKey() || e.key===demoKey()) refreshAll(); });

['fromA','toA','fromAmt'].forEach(id => document.getElementById(id).addEventListener('input', refreshAll));
document.getElementById('fromA').addEventListener('change', refreshAll);
document.getElementById('toA').addEventListener('change', refreshAll);
document.getElementById('flip').addEventListener('click', () => {
  const f = document.getElementById('fromA'), t = document.getElementById('toA');
  const tmp = f.value; f.value = t.value; t.value = tmp; refreshAll();
});
document.getElementById('doSwap').addEventListener('click', doSwap);

renderTfs();
renderWallet();
refreshAll();
</script>
